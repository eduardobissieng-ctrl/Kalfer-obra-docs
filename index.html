<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentos SST Kalfer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EBE7DD;
    --surface: #FFFFFF;
    --surface-2: #F5F2EA;
    --ink: #21262B;
    --ink-soft: #5B6268;
    --line: #D8D2C4;
    --blueprint: #2E4A66;
    --blueprint-soft: #E4EAF0;
    --yellow: #C98A00;
    --yellow-bg: #FBF0D9;
    --red: #B23A18;
    --red-bg: #F7E3DA;
    --green: #3F6B4C;
    --green-bg: #E3EDE5;
    --radius: 3px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    position: relative;
  }
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image: var(--watermark-img, none);
    background-repeat: no-repeat;
    background-position: center;
    background-size: min(46vw, 440px);
    opacity: 0.05;
    pointer-events: none;
    z-index: 0;
  }
  .app{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; position: relative; z-index: 1; }

  /* ---------- Header ---------- */
  .header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 16px; flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px; margin-bottom: 20px;
  }
  .header h1{
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 38px; letter-spacing: 0.3px;
    margin: 0; line-height: 1;
  }
  .header .sub{ color: var(--ink-soft); font-size: 14px; margin-top: 6px; }
  .btn{
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600; font-size: 14px;
    border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
    padding: 9px 16px; border-radius: var(--radius); cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover{ background: var(--ink); color: var(--surface); }
  .btn.primary{ background: var(--blueprint); border-color: var(--blueprint); color: #fff; }
  .btn.primary:hover{ background: #223a52; }
  .btn.ghost{ border-color: var(--line); font-weight: 500; }
  .btn.danger{ border-color: var(--red); color: var(--red); background:none; }
  .btn.danger:hover{ background: var(--red); color:#fff; }
  .btn.small{ padding: 5px 10px; font-size: 12.5px; }

  /* ---------- Alerts ---------- */
  .alerts{ margin-bottom: 22px; }
  .alerts-head{
    display:flex; align-items:center; gap: 10px; margin-bottom: 8px;
  }
  .alerts-head h2{
    font-family:'Barlow Condensed', sans-serif; font-size: 20px; font-weight:600; margin:0;
  }
  .alerts-count{
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    background: var(--red); color:#fff; padding: 2px 8px; border-radius: 20px;
  }
  .alerts-count.ok{ background: var(--green); }
  .alert-row{
    display:flex; align-items:center; gap: 12px;
    background: var(--surface); border-left: 4px solid var(--red);
    padding: 10px 14px; margin-bottom: 6px; border-radius: var(--radius);
    font-size: 14px;
  }
  .alert-row.warn{ border-left-color: var(--yellow); }
  .alert-row .emp{ font-weight: 600; }
  .alert-row .msg{ color: var(--ink-soft); flex:1; }
  .alert-row .days{ font-family:'IBM Plex Mono', monospace; font-size: 12.5px; font-weight:600; }
  .alert-row.warn .days{ color: var(--yellow); }
  .alert-row .days.late{ color: var(--red); }
  .alerts-empty{
    background: var(--surface); border-left: 4px solid var(--green);
    padding: 10px 14px; border-radius: var(--radius); font-size: 14px; color: var(--ink-soft);
  }

  /* ---------- Painel de indicadores (dashboard) ---------- */
  .stats-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px;
  }
  @media (max-width: 900px){ .stats-grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px){ .stats-grid{ grid-template-columns: repeat(2, 1fr); } }
  .stat-card{
    appearance:none; -webkit-appearance:none; width:100%; text-align:left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif; transition: box-shadow .15s;
  }
  .stat-card:hover{ box-shadow: 0 1px 8px rgba(33,38,43,0.12); }
  .stat-card.active{ box-shadow: 0 0 0 2px var(--ink) inset; }
  .stat-card .stat-label{
    font-size: 11.5px; font-weight:600; color: var(--ink-soft);
    display:flex; align-items:center; gap:7px; margin-bottom: 8px; line-height:1.25;
  }
  .stat-card .stat-value{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size: 32px; line-height:1; color: var(--ink);
  }
  .stat-card.total{ background: #ECECEC; border-color: #DADADA; }
  .stat-card.red{ background: var(--red-bg); border-color: #E7C4B4; }
  .stat-card.yellow{ background: var(--yellow-bg); border-color: #E9D6A8; }
  .stat-card.green{ background: var(--green-bg); border-color: #C7DBC9; }
  .dot.blue{ background: var(--blueprint); }
  .stats-clear{
    font-size: 12.5px; color: var(--blueprint); cursor:pointer; text-decoration: underline;
    margin: -10px 0 18px; display:inline-block; background:none; border:none; padding:0; font-family:'IBM Plex Sans',sans-serif;
  }

  /* ---------- Layout ---------- */
  .layout{ display:grid; grid-template-columns: 280px 1fr; gap: 20px; align-items:start; }
  @media (max-width: 760px){ .layout{ grid-template-columns: 1fr; } }

  .panel{ background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .panel-head{
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-head h2{ font-family:'Barlow Condensed', sans-serif; font-size: 18px; font-weight:600; margin:0; }

  /* employee list */
  .emp-list{ list-style:none; margin:0; padding: 6px; }
  .emp-item{
    display:flex; align-items:center; gap:10px;
    padding: 10px 10px; border-radius: var(--radius); cursor:pointer;
    border: 1px solid transparent;
  }
  .emp-item:hover{ background: var(--surface-2); }
  .emp-item.active{ background: var(--blueprint-soft); border-color: var(--blueprint); }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.green{ background: var(--green); }
  .dot.yellow{ background: var(--yellow); }
  .dot.red{ background: var(--red); }
  .dot.grey{ background: #C6C0B3; }
  .emp-item .name{ font-weight:600; font-size:14.5px; }
  .emp-item .role{ font-size:12px; color: var(--ink-soft); }
  .emp-empty{ padding: 20px 16px; color: var(--ink-soft); font-size: 14px; }

  /* detail */
  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;
  }
  .detail-head .who h2{ margin:0 0 2px; }
  .detail-head .who .role{ color: var(--ink-soft); font-size: 13.5px; }
  .detail-actions{ display:flex; gap:8px; }

  .doc-table{ width:100%; border-collapse: collapse; }
  .doc-table th{
    text-align:left; font-size: 12px; font-weight:600; color: var(--ink-soft);
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  .doc-table td{ padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  .doc-table tr:last-child td{ border-bottom:none; }
  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size: 12.5px; font-weight:600; padding: 3px 10px; border-radius: 20px;
  }
  .status-pill.green{ background: var(--green-bg); color: var(--green); }
  .status-pill.yellow{ background: var(--yellow-bg); color: var(--yellow); }
  .status-pill.red{ background: var(--red-bg); color: var(--red); }
  .doc-empty{ padding: 30px 16px; text-align:center; color: var(--ink-soft); font-size: 14px; }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:none; background:none; cursor:pointer; color: var(--ink-soft); font-size: 13px;
    padding: 3px 6px; border-radius: var(--radius);
  }
  .icon-btn:hover{ background: var(--surface-2); color: var(--ink); }

  /* add document form */
  .add-doc{ padding: 14px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
  .add-doc-toggle{ font-size: 14px; font-weight:600; color: var(--blueprint); cursor:pointer; user-select:none; }
  .form-grid{
    display:grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 10px; margin-top: 12px; align-items:end;
  }
  @media (max-width: 620px){ .form-grid{ grid-template-columns: 1fr; } }
  .field label{ display:block; font-size: 11.5px; font-weight:600; color: var(--ink-soft); margin-bottom: 4px; text-transform: none; }
  .field input, .field select{
    width:100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    font-family:'IBM Plex Sans',sans-serif; font-size: 14px; background:#fff; color: var(--ink);
  }
  .field input:focus, .field select:focus{ outline: 2px solid var(--blueprint); outline-offset: 1px; }

  /* modal */
  .overlay{
    position: fixed; inset:0; background: rgba(33,38,43,0.45);
    display:flex; align-items:center; justify-content:center; z-index: 50; padding: 16px;
  }
  .modal{
    background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 360px;
    padding: 22px; border: 1px solid var(--line);
  }
  .modal h3{ font-family:'Barlow Condensed',sans-serif; font-size: 20px; margin: 0 0 14px; }
  .modal .field{ margin-bottom: 12px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top: 16px; }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--ink-soft);
  }
  .empty-state h3{ font-family:'Barlow Condensed',sans-serif; color: var(--ink); font-size: 22px; margin-bottom: 6px; }
  .empty-state p{ font-size: 14px; max-width: 340px; margin: 0 auto 16px; }

  .toast{
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color:#fff; padding: 9px 18px; border-radius: var(--radius);
    font-size: 13.5px; z-index: 100; opacity:0; pointer-events:none; transition: opacity .2s;
  }
  .toast.show{ opacity: 1; }
  .loading{ padding: 40px; text-align:center; color: var(--ink-soft); font-size: 14px; }

  /* ---------- Login ---------- */
  .login-wrap{
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 20px;
  }
  .login-card{
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 32px 28px; width: 100%; max-width: 360px;
  }
  .login-card .brand{ display:flex; align-items:center; gap:12px; margin-bottom: 22px; }
  .login-card .brand img{ width:44px; height:44px; border-radius:8px; object-fit:cover; }
  .login-card h1{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size: 26px; margin:0;
  }
  .login-card .sub{ color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  .login-card form{ margin-top: 8px; }
  .login-card .field{ margin-bottom: 14px; }
  .login-card .btn{ width:100%; margin-top: 4px; }
  .login-error{
    background: var(--red-bg); color: var(--red); font-size: 13px; padding: 8px 12px;
    border-radius: var(--radius); margin-bottom: 14px;
  }
  .login-note{ text-align:center; margin-top: 14px; }
  .login-note a{ color: var(--blueprint); font-size: 12.5px; cursor:pointer; text-decoration: underline; }

  /* ---------- User bar / history ---------- */
  .user-bar{
    display:flex; align-items:center; gap: 10px; flex-wrap: wrap;
  }
  .user-badge{
    font-size: 12.5px; color: var(--ink-soft); display:flex; align-items:center; gap:6px;
  }
  .user-badge .who{ font-weight:600; color: var(--ink); }
  .history-table{ width:100%; border-collapse: collapse; }
  .history-table th{
    text-align:left; font-size: 11.5px; font-weight:600; color: var(--ink-soft);
    padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top:0; background: var(--surface);
  }
  .history-table td{ padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  .history-action{
    display:inline-block; font-size: 11px; font-weight:600; padding: 2px 8px; border-radius: 20px;
  }
  .history-action.insert{ background: var(--green-bg); color: var(--green); }
  .history-action.update{ background: var(--yellow-bg); color: var(--yellow); }
  .history-action.delete{ background: var(--red-bg); color: var(--red); }
  .history-when{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); white-space:nowrap; }
</style>
</head>

const SUPABASE_URL = 'https://cytygqcrzcdhhskwjgit.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eZ5MV_CSPL84nXqrBZ8dYA_DTt7PPD_';
const REST = `${SUPABASE_URL}/rest/v1`;
const STORAGE = `${SUPABASE_URL}/storage/v1`;
const AUTH = `${SUPABASE_URL}/auth/v1`;
const SESSION_KEY = 'kalfer_docs_session';

/* ---------- Sessão / autenticação ---------- */
let session = null; // { access_token, refresh_token, expires_at, email }
let loginError = '';
let loginBusy = false;
let historyOpen = false;
let historyRows = [];
let historyLoading = false;
let historyError = '';

function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(raw) session = JSON.parse(raw);
  }catch(e){ session = null; }
}
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){ /* ignora */ }
}
function clearSession(){
  session = null;
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){ /* ignora */ }
}

function sbHeaders(extra){
  const headers = { apikey: SUPABASE_KEY };
  if(session && session.access_token) headers.Authorization = `Bearer ${session.access_token}`;
  return Object.assign(headers, extra || {});
}

async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  try{
    const res = await fetch(`${AUTH}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if(!res.ok) return false;
    const data = await res.json();
    session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in || 3600) * 1000,
      email: data.user?.email || session.email
    };
    saveSession();
    return true;
  }catch(e){
    return false;
  }
}

async function ensureFreshSession(){
  if(!session) return false;
  if(!session.expires_at || session.expires_at - Date.now() < 60000){
    return await refreshSession();
  }
  return true;
}

/* Wrapper de fetch autenticado: garante token válido e trata expiração/401.
   Sempre recalcula apikey/Authorization com o token mais atual, mesmo que o
   chamador já tenha montado os headers antes de um possível refresh. */
async function apiFetch(url, options){
  await ensureFreshSession();
  const extraHeaders = stripAuth((options && options.headers) || {});
  const opts = Object.assign({}, options, { headers: sbHeaders(extraHeaders) });
  let res = await fetch(url, opts);
  if(res.status === 401){
    const refreshed = await refreshSession();
    if(refreshed){
      opts.headers = sbHeaders(extraHeaders);
      res = await fetch(url, opts);
    }
    if(res.status === 401){
      clearSession();
      showToast('Sessão expirada. Faça login novamente.');
      render();
    }
  }
  return res;
}

function stripAuth(headers){
  const h = Object.assign({}, headers);
  delete h.apikey;
  delete h.Authorization;
  return h;
}

async function loginWithPassword(email, password){
  loginBusy = true; loginError = ''; render();
  try{
    const res = await fetch(`${AUTH}/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.trim(), password })
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok){
      loginError = res.status === 400 ? 'E-mail ou senha incorretos.' : (data.error_description || data.msg || 'Não foi possível entrar. Tente novamente.');
      loginBusy = false;
      render();
      return;
    }
    session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in || 3600) * 1000,
      email: data.user?.email || email.trim()
    };
    saveSession();
    loginBusy = false;
    load();
  }catch(e){
    loginError = 'Falha de conexão. Verifique sua internet e tente novamente.';
    loginBusy = false;
    render();
  }
}

async function logout(){
  try{
    if(session && session.access_token){
      await fetch(`${AUTH}/logout`, { method: 'POST', headers: sbHeaders() });
    }
  }catch(e){ /* ignora */ }
  clearSession();
  state = { employees: [], documents: [] };
  selectedEmployeeId = null;
  historyOpen = false;
  render();
}

async function requestPasswordReset(email){
  try{
    await fetch(`${AUTH}/recover`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.trim() })
    });
  }catch(e){ /* ignora */ }
  showToast('Se o e-mail existir, enviamos um link para redefinir a senha.');
}

/* ---------- Histórico de alterações ---------- */
async function openHistory(){
  historyOpen = true;
  historyError = '';
  render();
  await loadHistory();
}

async function loadHistory(){
  historyLoading = true; render();
  try{
    const res = await apiFetch(`${REST}/audit_log?select=*&order=changed_at.desc&limit=300`, { headers: sbHeaders() });
    if(!res.ok) throw new Error('Falha ao carregar histórico');
    historyRows = await res.json();
    historyError = '';
  }catch(e){
    console.error('Falha ao carregar histórico', e);
    historyRows = [];
    historyError = 'Não foi possível carregar o histórico de alterações.';
  }
  historyLoading = false;
  render();
}

function closeHistory(){
  historyOpen = false;
  document.getElementById('history-overlay')?.remove();
  render();
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function statusFor(dateStr){
  const d = daysUntil(dateStr);
  if(d < 0) return 'red';
  if(d <= ALERT_WINDOW_DAYS) return 'yellow';
  return 'green';
}

function employeeStatus(empId){
  const docs = state.documents.filter(d => d.employee_id === empId);
  if(docs.length === 0) return 'grey';
  let worst = 'green';
  for(const doc of docs){
    const s = statusFor(doc.expiry_date);
    if(s === 'red') return 'red';
    if(s === 'yellow') worst = 'yellow';
  }
  return worst;
}

/* ---------- Indicadores (dashboard) ---------- */
/* Status de cada documento do colaborador (para contagens que não devem
   "esconder" um documento a vencer atrás de outro já vencido). */
function employeeDocStatuses(empId){
  return state.documents.filter(d => d.employee_id === empId).map(d => statusFor(d.expiry_date));
}

/* Um colaborador pode contar em mais de uma categoria: se tem um documento
   vencido e outro a vencer, ele aparece tanto em "Atrasados" quanto em
   "A vencer". "Em dia" e "Sem documentos" continuam exclusivos. */
function employeeMatchesFilter(empId, filter){
  if(!filter) return true;
  const statuses = employeeDocStatuses(empId);
  if(filter === 'red') return statuses.includes('red');
  if(filter === 'yellow') return statuses.includes('yellow');
  if(filter === 'green') return statuses.length > 0 && statuses.every(s => s === 'green');
  if(filter === 'grey') return statuses.length === 0;
  return true;
}

function computeStats(){
  const stats = { total: state.employees.length, red: 0, yellow: 0, green: 0, grey: 0 };
  state.employees.forEach(e => {
    const statuses = employeeDocStatuses(e.id);
    if(statuses.length === 0){ stats.grey++; return; }
    if(statuses.includes('red')) stats.red++;
    if(statuses.includes('yellow')) stats.yellow++;
    if(statuses.every(s => s === 'green')) stats.green++;
  });
  return stats;
}

const STAT_FILTER_LABEL = { red: 'Atrasados', yellow: 'A vencer', green: 'Em dia', grey: 'Sem documentos' };

function renderStats(){
  const stats = computeStats();
  const cards = [
    { key: '',       cls: 'total',  dot: 'blue',   label: 'Colaboradores cadastrados', value: stats.total },
    { key: 'red',    cls: 'red',    dot: 'red',    label: 'Atrasados (documentos vencidos)', value: stats.red },
    { key: 'yellow', cls: 'yellow', dot: 'yellow', label: `A vencer (próx. ${ALERT_WINDOW_DAYS} dias)`, value: stats.yellow },
    { key: 'green',  cls: 'green',  dot: 'green',  label: 'Em dia com a documentação', value: stats.green },
  ];
  return `
    <div class="stats-grid">
      ${cards.map(c => `
        <button type="button" class="stat-card ${c.cls} ${statusFilter === c.key && c.key !== '' ? 'active' : ''}" data-stat-filter="${c.key}">
          <div class="stat-label"><span class="dot ${c.dot}"></span>${c.label}</div>
          <div class="stat-value">${c.value}</div>
        </button>
      `).join('')}
    </div>
    ${statusFilter ? `<button type="button" class="stats-clear" id="clear-stat-filter">✕ Limpar filtro (${STAT_FILTER_LABEL[statusFilter]})</button>` : ''}
  `;
}

/* Lista de alertas (documentos atrasados ou a vencer) — some por padrão,
   só aparece ao clicar no cartão correspondente do painel de indicadores. */
function renderAlertsPanel(){
  const alerts = state.documents
    .map(doc => ({ ...doc, days: daysUntil(doc.expiry_date), status: statusFor(doc.expiry_date) }))
    .filter(d => d.status === statusFilter)
    .sort((a,b) => a.days - b.days);

  const title = statusFilter === 'red' ? 'Documentos atrasados' : `Documentos a vencer (próx. ${ALERT_WINDOW_DAYS} dias)`;
  const emptyMsg = statusFilter === 'red' ? 'Nenhum documento atrasado no momento.' : 'Nenhum documento perto do vencimento no momento.';

  return `
    <div class="alerts">
      <div class="alerts-head">
        <h2>${title}</h2>
        <span class="alerts-count ${alerts.length ? '' : 'ok'}">${alerts.length}</span>
      </div>
      ${alerts.length === 0
        ? `<div class="alerts-empty">${emptyMsg}</div>`
        : alerts.map(a => {
            const emp = state.employees.find(e => e.id === a.employee_id);
            const late = a.days < 0;
            const msg = late ? `venceu há ${Math.abs(a.days)} dia(s)` : `vence em ${a.days} dia(s)`;
            return `<div class="alert-row ${late ? '' : 'warn'}">
              <span class="emp">${emp ? escapeHtml(emp.name) : '—'}</span>
              <span class="msg">${escapeHtml(a.type)} — ${msg} (${fmtDate(a.expiry_date)})</span>
              <span class="days ${late ? 'late' : ''}">${late ? 'VENCIDO' : `${a.days}d`}</span>
            </div>`;
          }).join('')
      }
    </div>
  `;
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ---------- Carregamento inicial ---------- */
async function load(){
  loadSession();
  if(!session){
    render();
    return;
  }
  const ok = await ensureFreshSession();
  if(!ok){
    clearSession();
    render();
    return;
  }
  app.innerHTML = `<div class="loading">Carregando painel...</div>`;
  try{
    const [empRes, docRes] = await Promise.all([
      apiFetch(`${REST}/employees?select=*&order=name.asc`, { headers: sbHeaders() }),
      apiFetch(`${REST}/documents?select=*&order=expiry_date.asc`, { headers: sbHeaders() })
    ]);
    if(empRes.status === 401 || docRes.status === 401) return; // apiFetch já tratou a sessão expirada
    if(!empRes.ok || !docRes.ok) throw new Error('Falha ao carregar dados');
    state.employees = await empRes.json();
    state.documents = await docRes.json();
  }catch(e){
    console.error('Falha ao carregar', e);
    app.innerHTML = `<div class="loading">Não foi possível conectar ao banco de dados. Verifique sua conexão e recarregue a página.</div>`;
    return;
  }
  render();
}

async function addEmployee(name, role){
  try{
    const res = await apiFetch(`${REST}/employees`, {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
      body: JSON.stringify({ name: name.trim(), role: role.trim() || null })
    });
    if(!res.ok) throw new Error();

    state.employees.push(emp);

    selectedEmployeeId = emp.id;

  }catch(e){
    console.error('Falha ao adicionar colaborador', e);
    showToast('Não foi possível adicionar o colaborador.');
  }
}

async function removeEmployee(id){

    const docsToRemove = state.documents.filter(d => d.employee_id === id);
    await Promise.all(docsToRemove.filter(d => d.file_path).map(d => deleteAttachmentFile(d.file_path)));

    selectedEmployeeIdsForZip.delete(id);
    render();
    showToast('Colaborador removido.');
  }catch(e){
    console.error('Falha ao remover colaborador', e);
    showToast('Não foi possível remover o colaborador.');
  }

/* ---------- Anexos (Supabase Storage) ---------- */
/* O bucket "anexos" é privado: todo acesso passa pelo endpoint autenticado abaixo,
   nunca pela URL pública (/object/public/...), para que só usuários logados baixem arquivos. */
function attachmentUrl(path){
  return `${STORAGE}/object/anexos/${path}`;
}

async function fetchAttachmentBlob(path){
  const res = await apiFetch(attachmentUrl(path), { headers: sbHeaders() });
  if(!res.ok) throw new Error('fetch failed');
  return await res.blob();
}

function sanitizeFileName(name){
  return String(name).replace(/[\\/:*?"<>|]/g, '-').trim() || 'arquivo';
}

async function downloadAttachmentsZip(docsWithFiles, zipFileName, emptyMessage){
  if(docsWithFiles.length === 0){
    showToast(emptyMessage);
    return;
  }
  if(typeof JSZip === 'undefined'){
    showToast('Não foi possível carregar a ferramenta de compactação. Verifique sua conexão.');
    return;
  }

  showToast(`Preparando ${docsWithFiles.length} anexo(s)...`);
  const zip = new JSZip();
  const usedNames = new Set();
  let failCount = 0;

  for(const doc of docsWithFiles){
    try{
      const blob = await fetchAttachmentBlob(doc.file_path);

      const baseName = sanitizeFileName(`${doc.type} - ${doc.file_name || 'anexo'}`);
      let finalName = baseName;
      let counter = 2;
      while(usedNames.has(finalName.toLowerCase())){
        const dot = baseName.lastIndexOf('.');
        finalName = dot > -1 ? `${baseName.slice(0, dot)} (${counter})${baseName.slice(dot)}` : `${baseName} (${counter})`;
        counter++;
      }
      usedNames.add(finalName.toLowerCase());
      zip.file(finalName, blob);
    }catch(e){
      console.error('Falha ao baixar anexo para o zip', doc.id, e);
      failCount++;
    }
  }

  if(usedNames.size === 0){
    showToast('Não foi possível baixar nenhum anexo. Tente novamente.');
    return;
  }

  try{
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const zipUrl = URL.createObjectURL(zipBlob);
    const link = document.createElement('a');
    link.href = zipUrl;
    link.download = zipFileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(zipUrl), 4000);
    showToast(failCount > 0 ? `Zip baixado — ${failCount} anexo(s) falharam.` : 'Zip baixado com sucesso.');
  }catch(e){
    console.error('Falha ao gerar zip', e);
    showToast('Não foi possível gerar o arquivo zip.');
  }
}

async function downloadAllAttachments(employeeId){
  const emp = state.employees.find(e => e.id === employeeId);
  if(!emp) return;
  const docsWithFiles = state.documents.filter(d => d.employee_id === employeeId && d.file_path);

    'Este colaborador não tem nenhum anexo.'

}

async function downloadSelectedAttachments(employeeId){

async function downloadEmployeesZip(employeeIds){
  const emps = state.employees.filter(e => employeeIds.has(e.id));
  if(emps.length === 0){
    showToast('Nenhum colaborador selecionado.');
    return;
  }

  const items = [];
  emps.forEach(emp => {
    state.documents
      .filter(d => d.employee_id === emp.id && d.file_path)
      .forEach(doc => items.push({ doc, emp }));
  });

  if(items.length === 0){
    showToast('Nenhum dos colaboradores selecionados tem anexos.');
    return;
  }
  if(typeof JSZip === 'undefined'){
    showToast('Não foi possível carregar a ferramenta de compactação. Verifique sua conexão.');
    return;
  }

  showToast(`Preparando ${items.length} anexo(s) de ${emps.length} colaborador(es)...`);
  const zip = new JSZip();

  // pasta única por colaborador, evitando nomes repetidos
  const folderNames = new Map();
  const usedFolderLabels = new Set();
  emps.forEach(emp => {
    const base = sanitizeFileName(emp.name);
    let final = base;
    let counter = 2;
    while(usedFolderLabels.has(final.toLowerCase())){
      final = `${base} (${counter})`;
      counter++;
    }
    usedFolderLabels.add(final.toLowerCase());
    folderNames.set(emp.id, final);
  });

  const usedNamesPerFolder = new Map();
  let failCount = 0;

  for(const { doc, emp } of items){
    try{
      const blob = await fetchAttachmentBlob(doc.file_path);

      const folderName = folderNames.get(emp.id);
      if(!usedNamesPerFolder.has(folderName)) usedNamesPerFolder.set(folderName, new Set());
      const usedNames = usedNamesPerFolder.get(folderName);

      const baseName = sanitizeFileName(`${doc.type} - ${doc.file_name || 'anexo'}`);
      let finalName = baseName;
      let counter = 2;
      while(usedNames.has(finalName.toLowerCase())){
        const dot = baseName.lastIndexOf('.');
        finalName = dot > -1 ? `${baseName.slice(0, dot)} (${counter})${baseName.slice(dot)}` : `${baseName} (${counter})`;
        counter++;
      }
      usedNames.add(finalName.toLowerCase());
      zip.folder(folderName).file(finalName, blob);
    }catch(e){
      console.error('Falha ao baixar anexo para o zip', doc.id, e);
      failCount++;
    }
  }

  if([...usedNamesPerFolder.values()].every(s => s.size === 0)){
    showToast('Não foi possível baixar nenhum anexo. Tente novamente.');
    return;
  }

  try{
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const zipUrl = URL.createObjectURL(zipBlob);
    const link = document.createElement('a');
    link.href = zipUrl;
    link.download = emps.length === 1
      ? `Documentos - ${sanitizeFileName(emps[0].name)}.zip`
      : `Documentos - ${emps.length} colaboradores.zip`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(zipUrl), 4000);
    showToast(failCount > 0 ? `Zip baixado — ${failCount} anexo(s) falharam.` : 'Zip baixado com sucesso.');
  }catch(e){
    console.error('Falha ao gerar zip', e);
    showToast('Não foi possível gerar o arquivo zip.');
  }
}

async function deleteAttachmentFile(path){
  try{ await apiFetch(`${STORAGE}/object/anexos/${path}`, { method: 'DELETE', headers: sbHeaders() }); }
  catch(e){ /* ignora se já não existir */ }
}

async function attachFile(docId, file){
  if(file.size > MAX_FILE_SIZE){
    showToast('Arquivo muito grande (máx. 8MB).');
    return;
  }
  showToast('Enviando anexo...');
  try{
    const path = `${docId}/${encodeURIComponent(file.name)}`;
    const uploadRes = await apiFetch(`${STORAGE}/object/anexos/${path}`, {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'true' }),
      body: file
    });
    if(!uploadRes.ok) throw new Error('upload');
    const patchRes = await apiFetch(`${REST}/documents?id=eq.${docId}`, {
      method: 'PATCH',
      headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
      body: JSON.stringify({ file_name: file.name, file_path: path })
    });
    if(!patchRes.ok) throw new Error('patch');
    const [updated] = await patchRes.json();
    const idx = state.documents.findIndex(d => d.id === docId);
    if(idx > -1) state.documents[idx] = updated;
    render();
    showToast('Anexo salvo.');
  }catch(e){
    console.error('Falha ao salvar anexo', e);
    showToast('Não foi possível salvar o anexo.');
  }
}

async function viewAttachment(docId){
  const doc = state.documents.find(d => d.id === docId);
  if(!doc || !doc.file_path){ showToast('Anexo não encontrado.'); return; }
  const safeName = escapeHtml(doc.file_name || 'anexo');
  let previewUrl = null;
  let revoke = null;
  try{
    const blob = await fetchAttachmentBlob(doc.file_path);
    previewUrl = URL.createObjectURL(blob);
    revoke = previewUrl;
  }catch(e){ /* sem acesso ao arquivo — mostra aviso abaixo */ }

  const isImage = /\.(jpe?g|png|webp)$/i.test(doc.file_name || '');
  const isPdf = /\.pdf$/i.test(doc.file_name || '');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:540px;">
      <h3>${safeName}</h3>
      <div style="max-height:60vh; overflow:auto; border:1px solid var(--line); border-radius: var(--radius); margin-bottom:14px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; min-height:140px;">
        ${!previewUrl ? `<div style="padding:28px; color:var(--ink-soft); font-size:13.5px; text-align:center;">Não foi possível carregar este arquivo.</div>`
          : isImage ? `<img src="${previewUrl}" style="max-width:100%; display:block;">`
          : isPdf ? `<embed src="${previewUrl}" type="application/pdf" style="width:100%; height:420px;">`
          : `<div style="padding:28px; color:var(--ink-soft); font-size:13.5px; text-align:center;">Pré-visualização não disponível para este tipo de arquivo.<br>Use o botão "Baixar" abaixo.</div>`}
      </div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button type="button" class="btn ghost" id="close-viewer">Fechar</button>
        <div style="display:flex; gap:8px;">
          ${previewUrl ? `
          <a href="${previewUrl}" target="_blank" rel="noopener" class="btn ghost small" style="text-decoration:none;">Abrir em nova aba</a>
          <a href="${previewUrl}" download="${safeName}" class="btn primary small" style="text-decoration:none;">Baixar</a>
          ` : ''}
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const cleanup = () => { if(revoke) URL.revokeObjectURL(revoke); overlay.remove(); };
  overlay.querySelector('#close-viewer').addEventListener('click', cleanup);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) cleanup(); });
}

async function removeAttachment(docId){
  const doc = state.documents.find(d => d.id === docId);
  if(!doc || !doc.file_path) return;
  try{
    await deleteAttachmentFile(doc.file_path);
    const res = await apiFetch(`${REST}/documents?id=eq.${docId}`, {
      method: 'PATCH',
      headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
      body: JSON.stringify({ file_name: null, file_path: null })
    });
    if(!res.ok) throw new Error();
    const [updated] = await res.json();
    const idx = state.documents.findIndex(d => d.id === docId);
    if(idx > -1) state.documents[idx] = updated;
    selectedAttachmentIds.delete(docId);
    render();
    showToast('Anexo removido.');
  }catch(e){
    console.error('Falha ao remover anexo', e);
    showToast('Não foi possível remover o anexo.');
  }
}

function render(){
  if(!session){
    renderLogin();
    return;
  }

  app.innerHTML = `
    <div class="header">
      <div style="display:flex; align-items:center; gap:14px;">
        <img src="${LOGO_DATA_URI}" alt="Logo Kalfer" style="width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0;">
        <div>
          <h1>Documentos SST Kalfer</h1>
          <div class="sub">Painel de acompanhamento de documentos e vencimentos da equipe — sincronizado na nuvem</div>
        </div>
      </div>
      <div class="user-bar">
        <span class="user-badge">Logado como <span class="who">${escapeHtml(session.email || '')}</span></span>
        <button class="btn ghost small" id="btn-history">Histórico</button>
        <button class="btn ghost small" id="btn-logout">Sair</button>
        <button class="btn primary" id="btn-add-emp">+ Colaborador</button>
      </div>
    </div>

    ${renderStats()}

    ${(statusFilter === 'red' || statusFilter === 'yellow') ? renderAlertsPanel() : ''}

    ${state.employees.length === 0 ? renderEmptyState() : renderLayout()}
  `;

  document.getElementById('btn-add-emp')?.addEventListener('click', openAddEmployeeModal);
  document.getElementById('btn-add-emp-empty')?.addEventListener('click', openAddEmployeeModal);
  document.getElementById('btn-history')?.addEventListener('click', openHistory);
  document.getElementById('btn-logout')?.addEventListener('click', () => {
    openConfirmModal('Sair da sua conta?', () => logout());
  });
  document.querySelectorAll('[data-stat-filter]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-stat-filter') || null;
      statusFilter = (statusFilter === key) ? null : key;
      render();
    });
  });
  document.getElementById('clear-stat-filter')?.addEventListener('click', () => {
    statusFilter = null;
    render();
  });
  attachLayoutEvents();

  if(historyOpen) renderHistoryModal();
}

/* ---------- Histórico de alterações ---------- */
const HISTORY_ACTION_LABEL = { INSERT: 'Criado', UPDATE: 'Alterado', DELETE: 'Removido' };
const HISTORY_TABLE_LABEL = { employees: 'Colaborador', documents: 'Documento' };

function historyRowSummary(row){
  const data = row.new_data || row.old_data || {};
  if(row.table_name === 'employees'){
    return data.name ? escapeHtml(data.name) : '—';
  }
  if(row.table_name === 'documents'){
    const emp = state.employees.find(e => e.id === data.employee_id);
    const who = emp ? emp.name : (data.employee_id || '—');
    return `${escapeHtml(data.type || '—')} <span style="color:var(--ink-soft)">(${escapeHtml(who)})</span>`;
  }
  return '—';
}

function fmtDateTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso; }
}

function renderHistoryModal(){
  document.getElementById('history-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'history-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:720px;">
      <h3>Histórico de alterações</h3>
      <div style="max-height:60vh; overflow:auto; border:1px solid var(--line); border-radius: var(--radius); margin-bottom:14px;">
        ${historyLoading ? `<div class="loading">Carregando histórico...</div>`
          : historyError ? `<div class="loading">${escapeHtml(historyError)}</div>`
          : historyRows.length === 0 ? `<div class="loading">Nenhuma alteração registrada ainda.</div>`
          : `<table class="history-table">
              <thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Tipo</th><th>Registro</th></tr></thead>
              <tbody>
                ${historyRows.map(r => `
                  <tr>
                    <td class="history-when">${fmtDateTime(r.changed_at)}</td>
                    <td>${escapeHtml(r.changed_by_email || 'desconhecido')}</td>
                    <td><span class="history-action ${String(r.action).toLowerCase()}">${HISTORY_ACTION_LABEL[r.action] || r.action}</span></td>
                    <td>${HISTORY_TABLE_LABEL[r.table_name] || escapeHtml(r.table_name)}</td>
                    <td>${historyRowSummary(r)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`
        }
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="btn-refresh-history">Atualizar</button>
        <button type="button" class="btn primary" id="close-history">Fechar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#close-history').addEventListener('click', closeHistory);
  overlay.querySelector('#btn-refresh-history').addEventListener('click', loadHistory);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeHistory(); });
}

function renderLayout(){

  }
  const emp = state.employees.find(e => e.id === selectedEmployeeId);
  const empDocs = state.documents.filter(d => d.employee_id === emp.id)
    .sort((a,b) => new Date(a.expiry_date) - new Date(b.expiry_date));
  const visibleEmployees = statusFilter ? state.employees.filter(e => employeeMatchesFilter(e.id, statusFilter)) : state.employees;

  return `
    <div class="layout">
      <div class="panel">
        <div class="panel-head" style="justify-content:space-between;">
          <h2>Equipe ${statusFilter ? `<span style="font-size:12.5px; font-weight:500; color:var(--ink-soft);">(${visibleEmployees.length} de ${state.employees.length})</span>` : ''}</h2>
          <label style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;">
            <input type="checkbox" id="select-all-emp" ${visibleEmployees.length > 0 && visibleEmployees.every(e => selectedEmployeeIdsForZip.has(e.id)) ? 'checked' : ''}>
            Selecionar todos
          </label>
        </div>
        <ul class="emp-list">
          ${visibleEmployees.length === 0
            ? `<li class="emp-empty">Nenhum colaborador com esse status.</li>`
            : visibleEmployees.map(e => `
            <li class="emp-item ${e.id === emp.id ? 'active' : ''}" data-emp="${e.id}">
              <input type="checkbox" data-emp-select="${e.id}" ${selectedEmployeeIdsForZip.has(e.id) ? 'checked' : ''} style="cursor:pointer;" title="Selecionar para baixar em lote">
              <span class="dot ${employeeStatus(e.id)}"></span>
              <div>
                <div class="name">${escapeHtml(e.name)}</div>
                <div class="role">${e.role ? escapeHtml(e.role) : 'Sem função definida'}</div>
              </div>
            </li>
          `).join('')}
        </ul>
        <div style="padding:10px 12px; border-top:1px solid var(--line);">
          <button class="btn ghost small" id="btn-download-employees-zip" style="width:100%; ${selectedEmployeeIdsForZip.size === 0 ? 'opacity:0.5; cursor:not-allowed;' : ''}" ${selectedEmployeeIdsForZip.size === 0 ? 'disabled' : ''}>⬇ Baixar selecionados em pastas (${selectedEmployeeIdsForZip.size})</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="detail-head" style="width:100%">
            <div class="who">
              <h2>${escapeHtml(emp.name)}</h2>
              <div class="role">${emp.role ? escapeHtml(emp.role) : 'Sem função definida'}</div>
            </div>
            <div class="detail-actions">
              <button class="btn ghost small" id="btn-download-selected" ${selectedAttachmentIds.size === 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>⬇ Baixar selecionados (${selectedAttachmentIds.size})</button>
              <button class="btn ghost small" id="btn-download-all">⬇ Baixar anexos (.zip)</button>
              <button class="btn ghost small" id="btn-toggle-doc">+ Documento</button>
              <button class="btn danger small" id="btn-del-emp">Remover colaborador</button>
            </div>
          </div>
        </div>

        <table class="doc-table">
          <thead>
            <tr>
              <th>Documento</th>
              <th>Emissão</th>
              <th>Vencimento</th>
              <th>Status</th>
              <th>Responsável</th>
              <th>Anexo</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${empDocs.length === 0 ? `<tr><td colspan="7" class="doc-empty">Nenhum documento cadastrado para este colaborador.</td></tr>` :
              empDocs.map(doc => {
                const s = statusFor(doc.expiry_date);
                const label = s === 'red' ? 'Vencido' : s === 'yellow' ? 'A vencer' : 'Válido';
                const attachCell = doc.file_name
                  ? `<div class="row-actions">
                       <input type="checkbox" data-select-attach="${doc.id}" ${selectedAttachmentIds.has(doc.id) ? 'checked' : ''} title="Selecionar para baixar" style="cursor:pointer;">
                       <button class="icon-btn" data-view-doc="${doc.id}" title="Abrir anexo">📎 ${escapeHtml(doc.file_name)}</button>
                       <button class="icon-btn" data-remove-attach="${doc.id}">Remover</button>
                     </div>`
                  : `<label class="btn ghost small" style="cursor:pointer; display:inline-block;">+ Anexar
                       <input type="file" data-attach-doc="${doc.id}" style="display:none" accept=".pdf,.jpg,.jpeg,.png,.webp" title="PDF, JPG, PNG ou WEBP — máx. 8MB">
                     </label>`;
                const respCell = doc.responsible_name
                  ? `<span title="${escapeHtml(doc.responsible_email || '')}">${escapeHtml(doc.responsible_name)}</span>`
                  : `<span style="color:var(--ink-soft); font-size:12.5px;">Não definido</span>`;
                return `<tr>
                  <td>${escapeHtml(doc.type)}</td>

              <div class="field">
                <label>Tipo de documento</label>
                <input type="text" name="type" list="doc-types-list" required placeholder="Digite ou selecione">
              </div>
              <div class="field">
                <label>Emissão</label>
                <input type="date" name="issueDate" required>
              </div>
              <div class="field">
                <label>Vencimento</label>
                <input type="date" name="expiryDate" required>
              </div>
              <div class="field">
                <button type="submit" class="btn primary">Salvar</button>
              </div>
            </div>

              <div class="field">
                <label>Responsável pelo preenchimento</label>
                <input type="text" name="responsibleName" placeholder="Nome de quem cuida deste documento">
              </div>
              <div class="field">
                <label>E-mail do responsável</label>
                <input type="email" name="responsibleEmail" placeholder="para receber o alerta de vencimento">
              </div>
            </div>
            <div class="field" style="max-width:320px; margin-top:12px;">
              <label>Anexo (opcional)</label>
              <input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.webp">
              <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">PDF, JPG, PNG ou WEBP — máx. 8MB</div>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;
}

function attachLayoutEvents(){
  document.querySelectorAll('[data-emp]').forEach(el => {
    el.addEventListener('click', () => {
      selectedEmployeeId = el.getAttribute('data-emp');
      showAddDocForm = false;
      selectedAttachmentIds = new Set();
      render();
    });
  });

  document.querySelectorAll('[data-emp-select]').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('change', (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-emp-select');
      if(el.checked) selectedEmployeeIdsForZip.add(id);
      else selectedEmployeeIdsForZip.delete(id);
      render();
    });
  });

  document.getElementById('select-all-emp')?.addEventListener('change', (e) => {
    const visible = statusFilter ? state.employees.filter(emp => employeeMatchesFilter(emp.id, statusFilter)) : state.employees;
    if(e.target.checked){
      visible.forEach(emp => selectedEmployeeIdsForZip.add(emp.id));
    }else{
      visible.forEach(emp => selectedEmployeeIdsForZip.delete(emp.id));
    }
    render();
  });

  document.getElementById('btn-download-employees-zip')?.addEventListener('click', () => {
    downloadEmployeesZip(selectedEmployeeIdsForZip);
  });

  document.getElementById('btn-toggle-doc')?.addEventListener('click', () => {
    showAddDocForm = !showAddDocForm;
    render();
  });

  document.getElementById('btn-download-all')?.addEventListener('click', () => {
    downloadAllAttachments(selectedEmployeeId);
  });

  document.getElementById('btn-download-selected')?.addEventListener('click', () => {
    downloadSelectedAttachments(selectedEmployeeId);
  });

  document.querySelectorAll('[data-select-attach]').forEach(el => {
    el.addEventListener('change', () => {
      const id = el.getAttribute('data-select-attach');
      if(el.checked) selectedAttachmentIds.add(id);
      else selectedAttachmentIds.delete(id);
      render();
    });
  });

  document.getElementById('btn-del-emp')?.addEventListener('click', () => {
    const emp = state.employees.find(e => e.id === selectedEmployeeId);
    openConfirmModal(`Remover ${emp.name} e todos os seus documentos?`, () => {
      removeEmployee(selectedEmployeeId);
    });
  });

  document.querySelectorAll('[data-del-doc]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-del-doc');
      openConfirmModal('Remover este documento?', () => removeDocument(id));
    });
  });

  document.querySelectorAll('[data-edit-doc]').forEach(el => {
    el.addEventListener('click', () => {
      const doc = state.documents.find(d => d.id === el.getAttribute('data-edit-doc'));
      if(doc) openEditDocModal(doc);
    });
  });

  document.querySelectorAll('[data-view-doc]').forEach(el => {
    el.addEventListener('click', () => viewAttachment(el.getAttribute('data-view-doc')));
  });

  document.querySelectorAll('[data-remove-attach]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-remove-attach');
      openConfirmModal('Remover o anexo deste documento?', () => removeAttachment(id));
    });
  });

  document.querySelectorAll('[data-attach-doc]').forEach(el => {
    el.addEventListener('change', (e) => {
      const docId = el.getAttribute('data-attach-doc');
      const file = e.target.files[0];
      if(file) attachFile(docId, file);
    });
  });

  document.getElementById('doc-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const issueDate = f.get('issueDate');
    const expiryDate = f.get('expiryDate');
    if(new Date(expiryDate) < new Date(issueDate)){
      showToast('A data de vencimento deve ser após a emissão.');
      return;
    }
    const file = f.get('file');
    const newDoc = await addDocument(selectedEmployeeId, f.get('type'), issueDate, expiryDate, f.get('responsibleName'), f.get('responsibleEmail'));
    if(newDoc){
      showToast('Documento adicionado.');
      if(file && file.size > 0){
        await attachFile(newDoc.id, file);
      }
    }
  });
}

      <h3>Novo colaborador</h3>
      <form id="emp-form">

          <input type="text" name="role" placeholder="Ex.: Pedreiro, Eletricista, Encarregado">

          <button type="button" class="btn ghost" id="cancel-emp">Cancelar</button>
          <button type="submit" class="btn primary">Adicionar</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancel-emp').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });

function openEditDocModal(doc){

  overlay.className = 'overlay';

    <div class="modal">
      <h3>Editar documento</h3>
      <form id="edit-doc-form">
        ${docTypeDatalist()}
        <div class="field">
          <label>Tipo de documento</label>
          <input type="text" name="type" list="doc-types-list" value="${escapeHtml(doc.type)}" required>
        </div>
        <div class="field">
          <label>Emissão</label>
          <input type="date" name="issueDate" value="${doc.issue_date}" required>
        </div>
        <div class="field">
          <label>Vencimento</label>
          <input type="date" name="expiryDate" value="${doc.expiry_date}" required>
        </div>
        <div class="field">
          <label>Responsável pelo preenchimento</label>
          <input type="text" name="responsibleName" value="${escapeHtml(doc.responsible_name || '')}" placeholder="Nome de quem cuida deste documento">
        </div>
        <div class="field">
          <label>E-mail do responsável</label>
          <input type="email" name="responsibleEmail" value="${escapeHtml(doc.responsible_email || '')}" placeholder="para receber o alerta de vencimento">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cancel-edit-doc">Cancelar</button>
          <button type="submit" class="btn primary">Salvar alterações</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancel-edit-doc').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('#edit-doc-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const issueDate = f.get('issueDate');
    const expiryDate = f.get('expiryDate');
    if(new Date(expiryDate) < new Date(issueDate)){
      showToast('A data de vencimento deve ser após a emissão.');
      return;
    }
    updateDocument(doc.id, f.get('type'), issueDate, expiryDate, f.get('responsibleName'), f.get('responsibleEmail'));
    overlay.remove();
  });
}

function openConfirmModal(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Confirmar</h3>
      <p style="font-size:14px; color:var(--ink-soft); margin: 0 0 8px;">${message}</p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancel-confirm">Cancelar</button>
        <button type="button" class="btn danger" id="ok-confirm">Confirmar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancel-confirm').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('#ok-confirm').addEventListener('click', () => { onConfirm(); overlay.remove(); });
}
