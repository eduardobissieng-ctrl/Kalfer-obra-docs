<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Rigging Kalfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBE7DD; --surface:#FFFFFF; --surface-2:#F5F2EA; --ink:#21262B; --ink-soft:#5B6268; --line:#D8D2C4;
    --blueprint:#2E4A66; --blueprint-soft:#E4EAF0; --yellow:#C98A00; --yellow-bg:#FBF0D9; --red:#B23A18; --red-bg:#F7E3DA;
    --green:#3F6B4C; --green-bg:#E3EDE5; --orange:#C25E12; --orange-bg:#FBE7D6; --radius:3px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; }
  .app{ max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
  .header{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:16px; }
  .header h1{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:38px; letter-spacing:.3px; margin:0; line-height:1; }
  .header .sub{ color:var(--ink-soft); font-size:14px; margin-top:6px; }
  .header img{ width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .btn{ font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14px; border:1.5px solid var(--ink); background:var(--surface); color:var(--ink); padding:9px 16px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-block; }
  .btn:hover{ background:var(--ink); color:var(--surface); }
  .btn.primary{ background:var(--blueprint); border-color:var(--blueprint); color:#fff; }
  .btn.primary:hover{ background:#223a52; }
  .btn.ghost{ border-color:var(--line); font-weight:500; }
  .btn.danger{ border-color:var(--red); color:var(--red); background:none; }
  .btn.danger:hover{ background:var(--red); color:#fff; }
  .btn.small{ padding:5px 10px; font-size:12.5px; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tab{ font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:600; padding:8px 14px; border:1.5px solid var(--line); border-bottom:none; background:var(--surface-2); color:var(--ink-soft); cursor:pointer; border-radius:var(--radius) var(--radius) 0 0; }
  .tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .tabs-wrap{ display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; border-bottom:2px solid var(--ink); margin-bottom:16px; }
  .tabs-actions{ display:flex; gap:6px; padding-bottom:6px; flex-wrap:wrap; }

  .aviso{ background:var(--yellow-bg); border-left:4px solid var(--yellow); padding:10px 14px; font-size:13.5px; border-radius:var(--radius); margin-bottom:14px; line-height:1.45; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px 18px; margin-bottom:14px; }
  .panel-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .panel-head h2, .panel-head h3{ font-family:'Barlow Condensed',sans-serif; font-size:21px; font-weight:600; margin:0; }
  .panel-head .sp{ flex:1; }
  .sub-h{ font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:600; color:var(--blueprint); border-bottom:1px solid var(--line); margin:16px 0 10px; padding-bottom:3px; text-transform:uppercase; letter-spacing:.4px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:10px 14px; }
  .fld{ display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--ink-soft); font-weight:500; }
  .fld.w2{ grid-column:span 2; }
  .fld em{ font-style:normal; font-weight:400; }
  .fld input, .fld select{ font-family:'IBM Plex Sans',sans-serif; font-size:14px; padding:7px 9px; border:1.5px solid var(--line); border-radius:var(--radius); background:#fff; color:var(--ink); width:100%; }
  .fld input:focus, .fld select:focus{ outline:none; border-color:var(--blueprint); }
  .fld small{ font-weight:400; font-size:11.5px; line-height:1.3; }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin:6px 0 0; line-height:1.4; }
  .chip{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .chip.ok{ background:var(--green-bg); color:var(--green); }
  .chip.warn{ background:var(--yellow-bg); color:#8a5f00; }
  .chip.fail{ background:var(--red-bg); color:var(--red); }
  .chip.pend{ background:var(--blueprint-soft); color:var(--blueprint); }
  .auto-box{ margin-top:10px; background:var(--blueprint-soft); border-left:4px solid var(--blueprint); border-radius:var(--radius); padding:10px 14px; font-size:13.5px; line-height:1.5; }
  .auto-box ul{ margin:4px 0 6px; padding-left:20px; }
  .auto-box small{ color:var(--ink-soft); }
  .res{ margin-top:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; }
  .res-nums{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:8px; }
  .res-nums div{ font-size:12px; color:var(--ink-soft); }
  .res-nums b{ display:block; font-family:'Barlow Condensed',sans-serif; font-size:22px; color:var(--ink); line-height:1.1; }
  .ck{ display:flex; gap:8px; font-size:13px; padding:3px 0; line-height:1.35; }
  .ck i{ flex:0 0 10px; height:10px; border-radius:50%; margin-top:4px; }
  .ck.ok i{ background:var(--green); } .ck.warn i{ background:var(--yellow); } .ck.fail i{ background:var(--red); } .ck.pend i{ background:#9aa7b4; }
  .ck b{ font-weight:600; }
  table.tc{ border-collapse:collapse; }
  table.tc th{ font-size:12px; text-align:left; color:var(--ink-soft); padding:0 8px 4px 0; font-weight:500; }
  table.tc td{ padding:0 8px 6px 0; }
  table.tc input{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; padding:6px 8px; border:1.5px solid var(--line); border-radius:var(--radius); width:120px; }
  .xbtn{ border:none; background:none; color:var(--red); cursor:pointer; font-size:16px; padding:2px 6px; }
  .summary{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--blueprint); padding:10px 14px; border-radius:var(--radius); margin-bottom:14px; font-size:14px; }
  .foot{ color:var(--ink-soft); font-size:12px; margin-top:26px; text-align:center; }

  /* ---------- Documentos ---------- */
  .doc{ background:#fff; color:#111; max-width:210mm; margin:0 auto 20px; padding:13mm 14mm; box-shadow:0 1px 6px rgba(0,0,0,.18); font-size:11.5px; line-height:1.45; overflow-x:auto; }
  .doc h2{ font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; background:#21262B; color:#fff; padding:3px 8px; margin:14px 0 7px; letter-spacing:.3px; break-after:avoid; }
  .doc h3{ font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; color:#2E4A66; border-bottom:1.5px solid #2E4A66; margin:12px 0 6px; padding-bottom:1px; break-after:avoid; }
  .doc p{ margin:0 0 6px; }
  .doc ol, .doc ul{ margin:0 0 6px; padding-left:20px; }
  .doc li{ margin-bottom:2px; }
  .doc table{ border-collapse:collapse; width:100%; margin-bottom:8px; }
  .doc table.t th, .doc table.t td{ border:1px solid #777; padding:3px 6px; vertical-align:top; text-align:left; }
  .doc table.t th{ background:#ECE9E1; font-weight:600; }
  .doc table.t tr{ break-inside:avoid; }
  .doc table.t td.n, .doc table.t th.n{ text-align:right; white-space:nowrap; }
  .doc table.t td.c, .doc table.t th.c{ text-align:center; }
  .doc table.dh td{ border:1.5px solid #111; padding:6px 8px; vertical-align:middle; }
  .doc table.dh img{ width:56px; height:56px; object-fit:cover; display:block; }
  .doc .dh-tit .t1{ font-family:'Barlow Condensed',sans-serif; font-size:21px; font-weight:700; line-height:1.05; text-transform:uppercase; }
  .doc .dh-tit .t2{ font-size:11.5px; color:#333; margin-top:2px; }
  .doc .dh-meta{ font-size:11px; white-space:nowrap; width:1%; }
  .doc .calc{ border-left:3px solid #2E4A66; background:#F4F6F8; padding:5px 9px; margin-bottom:6px; break-inside:avoid; }
  .doc .st{ font-weight:700; white-space:nowrap; }
  .doc .st.ok{ color:#2c6a3f; } .doc .st.warn{ color:#8a5f00; } .doc .st.fail{ color:#B23A18; } .doc .st.pend{ color:#2E4A66; }
  .doc .verdict{ border:2px solid #111; padding:8px 12px; margin:8px 0; font-size:13px; break-inside:avoid; }
  .doc .verdict.ok{ border-color:#2c6a3f; background:#EEF5F0; } .doc .verdict.warn{ border-color:#C98A00; background:#FDF6E6; }
  .doc .verdict.fail{ border-color:#B23A18; background:#FBEDE8; } .doc .verdict.pend{ border-color:#2E4A66; background:#EEF2F6; }
  .doc .nota{ font-size:10.5px; color:#444; border:1px dashed #888; padding:5px 8px; margin:8px 0; break-inside:avoid; }
  .doc .croquis{ display:flex; gap:8px; align-items:stretch; margin-bottom:8px; break-inside:avoid; }
  .doc .croquis > div{ border:1px solid #777; padding:4px; }
  .doc .croquis .el{ flex:1.9; } .doc .croquis .pl{ flex:1; }
  .doc .croquis svg{ width:100%; height:auto; display:block; }
  .doc .croquis .cap{ font-size:10px; text-align:center; color:#444; }
  .doc .croqui-vazio{ padding:26px 10px; text-align:center; color:#666; font-size:11px; }
  .doc .assin{ display:grid; grid-template-columns:1fr 1fr; gap:26px 30px; margin-top:26px; break-inside:avoid; }
  .doc .assin div{ border-top:1px solid #111; padding-top:3px; font-size:11px; text-align:center; }
  .doc .ficha{ margin-bottom:12px; }
  .doc .keep{ break-inside:avoid; }
  .doc .pb{ break-before:page; }
  .doc .box{ display:inline-block; width:11px; height:11px; border:1px solid #111; vertical-align:-1px; }

  @page{ size:A4; margin:11mm; }
  @media print{
    body{ background:#fff; }
    .ui, .no-print{ display:none !important; }
    .app{ max-width:none; padding:0; }
    .docs-area{ display:block !important; }
    .doc{ display:none !important; box-shadow:none; max-width:none; margin:0; padding:0; overflow:visible; }
    body[data-print="plano"] #doc-plano, body[data-print="memorial"] #doc-memorial,
    body[data-print="laudo"] #doc-laudo, body[data-print="checklists"] #doc-checklists{ display:block !important; }
    body[data-print="all"] .doc{ display:block !important; break-after:page; }
    body[data-print="all"] .doc:last-child{ break-after:auto; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="ui">
    <div class="header">
      <div style="display:flex; align-items:center; gap:14px;">
        <img id="logo-top" alt="Logo Kalfer">
        <div>
          <h1>Plano de Rigging Kalfer</h1>
          <div class="sub">Içamento de telhas e estrutura metálica com munck — gera o plano, o memorial de cálculo, o laudo e os checklists</div>
        </div>
      </div>
      <a class="btn ghost small" href="index.html">← Documentos SST</a>
    </div>

    <div class="tabs-wrap">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="dados">1. Dados</button>
        <button class="tab" data-tab="plano">Plano de Rigging</button>
        <button class="tab" data-tab="memorial">Memorial de Cálculo</button>
        <button class="tab" data-tab="laudo">Laudo Técnico</button>
        <button class="tab" data-tab="checklists">Checklists</button>
      </div>
      <div class="tabs-actions">
        <button class="btn small primary" data-act="print">Imprimir / salvar PDF</button>
        <button class="btn small" data-act="print-all">Imprimir tudo</button>
      </div>
    </div>
  </div>

  <div class="ui" id="view-dados"></div>
  <div class="docs-area" id="view-docs" style="display:none;">
    <div class="doc" id="doc-plano"></div>
    <div class="doc" id="doc-memorial"></div>
    <div class="doc" id="doc-laudo"></div>
    <div class="doc" id="doc-checklists"></div>
  </div>
  <div class="foot ui">Plano de Rigging Kalfer · versão <span id="ver"></span> · Os dados ficam salvos neste navegador. Use “Exportar plano” para guardar ou enviar para outra pessoa.</div>
</div>
<input type="file" id="file-import" accept=".json,application/json" style="display:none">

function carregar(){

    const raw = localStorage.getItem(LS_PLANO);
    if(raw) return normalizar(JSON.parse(raw));
  }catch(e){}
  return novoPlano();

function normalizar(p){
  const base = novoPlano();
  const out = { obra:{...base.obra, ...(p.obra||{})}, munck:{...base.munck, ...(p.munck||{})}, local:{...base.local, ...(p.local||{})}, icamentos:[] };
  if(!Array.isArray(out.munck.tabela)) out.munck.tabela = base.munck.tabela;
  out.icamentos = (Array.isArray(p.icamentos) ? p.icamentos : []).map(ic => ({ ...novoIcamento(ic.tipo === 'estrutura' ? 'estrutura' : 'telha'), ...ic, id: ic.id || uid(),
    amarracao: ic.amarracao || (num(ic.lingaCmt) > 0 ? 'manual' : 'auto') }));
  return out;
}

const nomeMunck = m => [m.marca, m.modelo, m.placa].map(x => String(x||'').trim()).filter(Boolean).join(' · ');

/* ---------- Peso da carga ---------- */
const faltam = itens => 'Falta informar: ' + itens.join(', ') + '.';
function pesoCarga(ic){
  const C = num(ic.dimC), Lg = num(ic.dimL);
  let P = NaN, pesoTxt = '';
  const falta = [];
  if(ic.tipo === 'telha'){
    const k = num(ic.kgm2), n = num(ic.tPecas), emb = n0(ic.tEmb);
    P = k * C * Lg * n + emb;
    pesoTxt = `P = peso por m² × comprimento × largura × nº de telhas${emb ? ' + embalagem' : ''} = ${f(k)} × ${f(C)} × ${f(Lg)} × ${f(n,0)}${emb ? ` + ${f(emb,0)}` : ''} = <b>${f(P,0)} kg</b>`;
    if(!(k > 0)) falta.push('peso da telha (kg/m²)');
    if(!(C > 0)) falta.push('comprimento da telha');
    if(!(Lg > 0)) falta.push('largura da telha');
    if(!(n > 0)) falta.push('telhas por fardo');
  } else if(ic.ePesoModo === 'linear'){
    const k = num(ic.eKgm), q = num(ic.eQtd) > 0 ? num(ic.eQtd) : 1, ac = n0(ic.eAcresc);
    P = k * C * q * (1 + ac/100);
    pesoTxt = `P = peso linear × comprimento × nº de perfis × (1 + acréscimo de ligações) = ${f(k)} kg/m × ${f(C)} m × ${f(q,0)} × ${f(1+ac/100)} = <b>${f(P,0)} kg</b>`;
    if(!(k > 0)) falta.push('peso do perfil (kg/m)');
    if(!(C > 0)) falta.push('comprimento da peça');
  } else {
    P = num(ic.ePeso);
    pesoTxt = `P = <b>${f(P,0)} kg</b> (peso informado — conferir com o projeto / romaneio do fabricante)`;
    if(!(P > 0)) falta.push('peso da peça');
  }
  return { P, pesoTxt, falta };
}

/* ---------- Amarração automática ----------
   Escolhe lingas, manilhas e balancim a partir do peso e das dimensões da carga, com acessórios de catálogo:
   telhas = 2 cintas em cesto (com balancim acima de 6 m); estrutura = 2 lingas de cabo de aço enforcadas.
   Pontos de pega a ~55 % do comprimento; ângulo com a vertical de 30° (ou até 45° se a lança não alcançar). */
function autoAmarracao(ic){
  const m = S.munck, L = S.local;
  const fc = num(L.fc) > 0 ? num(L.fc) : 1.10, fad = num(L.fad) > 0 ? num(L.fad) : 1.15;
  const { P } = pesoCarga(ic);
  const C = num(ic.dimC), Lg = n0(ic.dimL), H = n0(ic.dimA), r = num(ic.raio), cota = n0(ic.cota);
  const folga = isFinite(num(ic.folga)) ? num(ic.folga) : 1.5, hp = num(m.alturaPivo), lmax = num(m.lancaMax);
  const telha = ic.tipo === 'telha', bal = telha && C > 6;
  const txtN = v => String(Math.round(v * 100) / 100).replace('.', ',');
  const sobe = (v, passo) => Math.ceil(v / passo - 1e-9) * passo;
  const comercial = v => COMPR_LINGA.find(x => x >= v - 1e-9) || sobe(v, 1);
  const escolhe = (cat, req) => cat.find(x => x[0] >= req) || cat[cat.length - 1];
  const cabeLanca = hAm => !(r > 0 && hp > 0 && lmax > 0) || Math.sqrt(r*r + Math.pow(Math.max(0, cota + folga + H + hAm - hp), 2)) <= lmax;
  const rad = g => g * Math.PI / 180;
  Object.assign(ic, { pernas:'2', pernasEf:'auto', cabosGuia:'2', pegaB:'', lingaTipo: telha ? 'cinta' : 'cabo', modo: telha ? 'cesto' : 'enforcado',
    balancim: bal ? 'sim' : 'nao', lingaComp:'', pegaA:'', lingaCmt:'', lingaPeso:'', lingaEspec:'', manilhaQtd: bal ? '4' : '2', manilhaCmt:'', manilhaPeso:'', manilhaEspec:'',
    balPeso:'', balCmt:'', balComp:'', supComp:'', supCmt:'', supEspec:'' });
  if(!(C > 0)) return;
  const cat = CAT_LINGAS[ic.lingaTipo], W = P * fc, mf = MODO_FATOR[ic.modo];
  let beta = 0, Lc, fisico, Lb = 0, Ls = 0, betaS = 0;
  if(bal){
    Lb = sobe(C * 0.5, 0.5); Lc = 1;
    for(const alvo of [30, 45]){ Ls = sobe((Lb/2) / Math.sin(rad(alvo)), 0.5); betaS = Math.asin((Lb/2) / Ls); if(cabeLanca(Lc + Ls * Math.cos(betaS))) break; }
    fisico = comercial(2*Lc + 2*H + Lg);
    Object.assign(ic, { balComp:txtN(Lb), supComp:txtN(Ls), balPeso:txtN(Math.round(Lb * 30)) });
  } else {
    const a = Math.round(C * 0.55 * 10) / 10;
    for(const alvo of [30, 45]){ Lc = Math.max(1, sobe((a/2) / Math.sin(rad(alvo)), 0.5)); beta = Math.asin((a/2) / Lc); if(cabeLanca(Lc * Math.cos(beta))) break; }
    fisico = telha ? comercial(2*Lc + 2*H + Lg) : comercial(Lc + 2*(Lg + H));
    ic.pegaA = txtN(a);
  }
  ic.lingaComp = txtN(Lc);
  if(!(P > 0)){ ic.lingaEspec = `comprimento ${txtN(fisico)} m`; return; }
  const T = W * fad / (2 * Math.cos(beta));
  const li = escolhe(cat, T / mf);
  let pLing = 2 * fisico * li[2], Tsup = 0;
  ic.lingaCmt = String(li[0]); ic.lingaEspec = `${li[1]}, comprimento ${txtN(fisico)} m`;
  if(bal){
    const pBal = n0(ic.balPeso), pInf = pLing;
    for(let k = 0; k < 3; k++){
      Tsup = (W + pLing + pBal) * fad / (2 * Math.cos(betaS));
      const su = escolhe(CAT_LINGAS.cabo, Tsup);
      ic.supCmt = String(su[0]); ic.supEspec = `cabo de aço ${su[1]}`;
      pLing = pInf + 2 * Ls * su[2];
    }
    ic.balCmt = String(CAT_BALANCINS.find(x => x >= (W + pLing) * fad) || CAT_BALANCINS[CAT_BALANCINS.length - 1]);
  }
  const ma = escolhe(CAT_MANILHAS, Math.max(T, Tsup));
  Object.assign(ic, { lingaPeso:txtN(pLing), manilhaCmt:String(ma[0]), manilhaPeso:txtN(ma[2]), manilhaEspec:ma[1] });
}

/* ---------- Cálculo de um içamento ---------- */
function calcIc(ic){
  const m = S.munck, L = S.local, ck = [];
  const add = (k, nome, st, det) => ck.push({ k, nome, st, det });
  const fc = num(L.fc) > 0 ? num(L.fc) : 1.10;
  const fad = num(L.fad) > 0 ? num(L.fad) : 1.15;
  const utilMax = num(L.utilMax) > 0 ? num(L.utilMax) : 80;
  const C = num(ic.dimC), Lg = num(ic.dimL), H = num(ic.dimA);
  const bal = ic.balancim === 'sim';

  // Peso da carga
  const auto = ic.amarracao === 'auto';
  const { P, pesoTxt, falta: faltaPeso } = pesoCarga(ic);
  if(!(P > 0)) add('peso', 'Peso da carga', 'pend', faltam(faltaPeso));

  // Acessórios e carga bruta
  const pLing = n0(ic.lingaPeso), pMan = n0(ic.manilhaQtd) * n0(ic.manilhaPeso), pBal = bal ? n0(ic.balPeso) : 0, pGancho = n0(m.pesoGancho);
  const Pac = pLing + pMan + pBal + pGancho;
  const CB = P * fc + Pac;

  // Capacidade no raio
  const tab = (m.tabela || []).map(t => ({ r:num(t.raio), c:num(t.cap) })).filter(t => t.r > 0 && t.c > 0).sort((a,b) => a.r - b.r);
  const r = num(ic.raio);
  let cap = NaN, rTab = NaN, util = NaN;
  if(!tab.length) add('cap', 'Capacidade do munck no raio', 'pend', 'Preencha a tabela de carga do munck (manual do fabricante).');
  else if(!(r > 0)) add('cap', 'Capacidade do munck no raio', 'pend', 'Informe o raio de operação.');
  else {
    const t = tab.find(t => t.r >= r - 1e-9);
    if(!t){ cap = 0; add('cap', 'Capacidade do munck no raio', 'fail', `Raio de ${f(r)} m é maior que o maior raio da tabela de carga (${f(tab[tab.length-1].r)} m).`); }
    else {
      cap = t.c; rTab = t.r;
      if(P > 0){
        util = CB / cap * 100;
        add('cap', 'Capacidade do munck no raio', util <= utilMax ? 'ok' : 'fail',
          `Carga bruta ${f(CB,0)} kg ÷ capacidade ${f(cap,0)} kg (raio tabelado ${f(rTab)} m) = ${f(util,1)} % — limite ${f(utilMax,0)} %.`);
      }
    }
  }

  // Lingas
  const n = Math.max(1, parseInt(ic.pernas) || 1);
  const nEf = ic.pernasEf === '2' ? Math.min(n, 2) : Math.min(n, 3);
  const mf = MODO_FATOR[ic.modo] || 1;
  const Lc = num(ic.lingaComp);
  const W = P * fc;                      // carga suspensa pelas lingas (inferiores)
  let beta = NaN, d = 0, hLing = NaN;
  if(bal || n === 1){ beta = 0; d = 0; hLing = Lc; }
  else {
    const a = num(ic.pegaA), b = n >= 4 ? n0(ic.pegaB) : 0;
    d = Math.sqrt(a*a + b*b) / 2;
    if(Lc > 0 && a > 0){
      if(d >= Lc) add('ang', 'Ângulo das lingas', 'fail', `Lingas curtas demais: comprimento ${f(Lc)} m para pontos de pega afastados ${f(d)} m do centro.`);
      else { beta = Math.asin(d / Lc); hLing = Lc * Math.cos(beta); }
    } else add('ang', 'Ângulo das lingas', 'pend', auto ? 'Informe o comprimento da carga para o sistema definir as lingas.' : faltam([!(Lc > 0) && 'comprimento de cada perna', !(a > 0) && 'distância entre os pontos de pega'].filter(Boolean)));
  }
  if(isFinite(beta) && !bal && n > 1){
    const bg = deg(beta);
    add('ang', 'Ângulo das lingas', bg <= 45 ? 'ok' : (bg <= 60 ? 'warn' : 'fail'),
      `Ângulo com a vertical β = ${f(bg,1)}° ` + (bg <= 45 ? '(até 45°: recomendado).' : bg <= 60 ? '(entre 45° e 60°: permitido, mas use lingas mais longas se possível).' : '(acima de 60°: proibido — use lingas mais longas ou balancim).'));
  }
  if((bal || n === 1) && !(Lc > 0)) add('ang', 'Comprimento das lingas', 'pend', auto ? 'Informe o comprimento da carga para o sistema definir as lingas.' : 'Falta informar: comprimento das lingas.');
  const T = isFinite(beta) && P > 0 ? W * fad / (nEf * Math.cos(beta)) : NaN;   // força por perna
  const cmtReq = T / mf;
  const cmt = num(ic.lingaCmt);
  const pendAuto = 'O sistema escolhe assim que o peso e o comprimento da carga forem informados.';
  const minimo = v => isFinite(v) ? ` Mínimo necessário: ${f(v,0)} kg.` : '';
  if(!(cmt > 0)) add('linga', 'Capacidade das lingas', 'pend', auto ? pendAuto : 'Falta informar: CMT (carga máxima de trabalho) de cada linga, gravada na etiqueta.' + minimo(cmtReq));
  else if(isFinite(cmtReq)) add('linga', 'Capacidade das lingas', cmt >= cmtReq ? 'ok' : 'fail',
      `CMT necessária por linga ${f(cmtReq,0)} kg × CMT da linga ${f(cmt,0)} kg (${f(cmtReq/cmt*100,0)} % de uso).`);

  // Manilhas
  const manQ = n0(ic.manilhaQtd), manCmt = num(ic.manilhaCmt);
  if(manQ > 0){
    if(!(manCmt > 0)) add('man', 'Capacidade das manilhas', 'pend', auto ? pendAuto : 'Falta informar: CMT de cada manilha.' + minimo(T));
    else if(isFinite(T)) add('man', 'Capacidade das manilhas', manCmt >= T ? 'ok' : 'fail', `Força por ponto ${f(T,0)} kg × CMT da manilha ${f(manCmt,0)} kg.`);
  }

  // Balancim e lingas superiores
  let betaS = NaN, Tsup = NaN, hSup = 0, Wbal = NaN;
  if(bal){
    const Lb = num(ic.balComp), Ls = num(ic.supComp), bc = num(ic.balCmt), sc = num(ic.supCmt);
    Wbal = (W + pLing) * fad;
    if(!(bc > 0)) add('bal', 'Capacidade do balancim', 'pend', auto ? pendAuto : 'Falta informar: CMT do balancim (plaqueta de identificação).' + minimo(P > 0 ? Wbal : NaN));
    else if(P > 0) add('bal', 'Capacidade do balancim', bc >= Wbal ? 'ok' : 'fail', `Carga no balancim ${f(Wbal,0)} kg × CMT do balancim ${f(bc,0)} kg.`);
    if(!(Lb > 0) || !(Ls > 0)) add('sup', 'Lingas superiores do balancim', 'pend', auto ? pendAuto : faltam([!(Lb > 0) && 'comprimento do balancim', !(Ls > 0) && 'comprimento das lingas superiores'].filter(Boolean)));
    else if(Lb/2 >= Ls) add('sup', 'Lingas superiores do balancim', 'fail', 'Lingas superiores curtas demais para o comprimento do balancim.');
    else {
      betaS = Math.asin((Lb/2) / Ls); hSup = Ls * Math.cos(betaS);
      const bg = deg(betaS);
      Tsup = P > 0 ? (W + pLing + pBal) * fad / (2 * Math.cos(betaS)) : NaN;
      if(bg > 60) add('sup', 'Lingas superiores do balancim', 'fail', `Ângulo com a vertical ${f(bg,1)}° — acima de 60° é proibido.`);
      else if(!(sc > 0)) add('sup', 'Lingas superiores do balancim', 'pend', auto ? pendAuto : 'Falta informar: CMT das lingas superiores.' + minimo(Tsup));
      else if(isFinite(Tsup)) add('sup', 'Lingas superiores do balancim', sc < Tsup ? 'fail' : (bg > 45 ? 'warn' : 'ok'),
        `Força por perna ${f(Tsup,0)} kg × CMT ${f(sc,0)} kg; ângulo com a vertical ${f(bg,1)}°.`);
    }
  }

  // Altura e lança
  const cota = n0(ic.cota), folga = isFinite(num(ic.folga)) ? num(ic.folga) : 1.5;
  const hp = num(m.alturaPivo), lmax = num(m.lancaMax);
  const hTot = (isFinite(hLing) ? hLing : NaN) + (bal ? hSup : 0);
  const Hnec = cota + folga + (H > 0 ? H : 0) + hTot;
  let Lreq = NaN, angL = NaN;
  const faltaLanca = [!(r > 0) && 'raio de operação', !(H > 0) && (ic.tipo === 'telha' ? 'altura do fardo' : 'altura da peça'),
    !isFinite(hTot) && (auto ? 'comprimento da carga' : 'comprimento das lingas'), !(hp > 0) && 'altura do pivô da lança (munck)', !(lmax > 0) && 'comprimento máximo de lança (munck)'].filter(Boolean);
  if(faltaLanca.length) add('lanca', 'Alcance da lança', 'pend', faltam(faltaLanca));
  else {
    const dh = Math.max(0, Hnec - hp);
    Lreq = Math.sqrt(r*r + dh*dh); angL = deg(Math.atan2(dh, r));
    add('lanca', 'Alcance da lança', Lreq <= lmax ? (Lreq > 0.95*lmax ? 'warn' : 'ok') : 'fail',
      `Altura necessária do gancho ${f(Hnec)} m → lança necessária ≈ ${f(Lreq)} m (ângulo ${f(angL,0)}°) × lança máxima ${f(lmax)} m.`);
  }

  // Patola e solo
  const B = num(m.abertura), Wc = num(m.pesoConjunto), Rfab = num(m.reacaoFab);
  const Q = CB * fad;
  let Rp = NaN, rpFab = false;
  if(Rfab > 0){ Rp = Rfab; rpFab = true; }
  else if(B > 0 && Wc > 0 && r > 0 && P > 0) Rp = Q * (r/B + 0.5) + Wc/2;
  const A = n0(L.calcoL) * n0(L.calcoC), sigma = num(L.sigma);
  let pSolo = NaN, Amin = NaN;
  if(!isFinite(Rp)) add('solo', 'Pressão no solo (patolas)', 'pend', faltam([!(P > 0) && 'peso da carga', !(r > 0) && 'raio de operação',
    !(Wc > 0) && 'peso total do conjunto (munck)', !(B > 0) && 'abertura das patolas (munck)'].filter(Boolean)));
  else if(!(A > 0) || !(sigma > 0)) add('solo', 'Pressão no solo (patolas)', 'pend', faltam([!(A > 0) && 'dimensões do calço da patola', !(sigma > 0) && 'tensão admissível do solo'].filter(Boolean)));
  else {
    pSolo = Rp / A; Amin = Rp / sigma;
    add('solo', 'Pressão no solo (patolas)', pSolo <= sigma ? 'ok' : 'fail',
      `Reação na patola ${f(Rp,0)} kgf ÷ calço ${f(A,0)} cm² = ${f(pSolo)} kgf/cm² × admissível ${f(sigma)} kgf/cm²` +
      (pSolo > sigma ? ` — calço mínimo ${f(Math.ceil(Math.sqrt(Amin)),0)} × ${f(Math.ceil(Math.sqrt(Amin)),0)} cm.` : '.'));
  }

  // Vento
  const Vlim = ic.tipo === 'telha' ? (num(L.ventoTelha) > 0 ? num(L.ventoTelha) : 20) : (num(L.vento) > 0 ? num(L.vento) : 30);

    `Força do vento a ${f(Vlim,0)} km/h ≈ ${f(Fv,0)} kgf (${f(rv,1)} % do peso)` + (rv > 10 ? ' — carga com muita área: usar 2 cabos-guia e reduzir o limite de vento.' : '.'));

    if(!(dist > 0)) add('rede', 'Distância da rede elétrica', 'pend', 'Informe a menor distância entre a rede e a lança/carga em qualquer posição.');
    else add('rede', 'Distância da rede elétrica', dist >= dMin ? 'ok' : 'fail', `Distância prevista ${f(dist)} m × mínima ${f(dMin,1)} m para ${f(kv,1)} kV.`);
  }

  const st = ck.some(c => c.st === 'fail') ? 'fail' : ck.some(c => c.st === 'pend') ? 'pend' : ck.some(c => c.st === 'warn') ? 'warn' : 'ok';

           T, cmtReq, cmt, manQ, manCmt, betaS, Tsup, hSup, Wbal, cota, folga, hp, lmax, Hnec, Lreq, angL, B, Wc, Q, Rp, rpFab, A, sigma, pSolo, Amin,

}
function calcTudo(){
  S.icamentos.forEach(ic => { if(ic.amarracao === 'auto') autoAmarracao(ic); });
  const cs = S.icamentos.map(calcIc);
  const g = [];
  const val = S.munck.inspecaoValidade, dt = S.obra.data;
  if(!val) g.push({ st:'warn', nome:'Inspeção do munck', det:'Validade da inspeção/laudo do munck não informada — conferir antes da operação.' });
  else if(dt && val < dt) g.push({ st:'fail', nome:'Inspeção do munck', det:`Inspeção/laudo do munck vencido em ${fmtData(val)}.` });
  else g.push({ st:'ok', nome:'Inspeção do munck', det:`Inspeção/laudo do munck válido até ${fmtData(val)}.` });
  const all = cs.map(c => c.st).concat(g.map(x => x.st));
  const st = !cs.length ? 'pend' : all.includes('fail') ? 'fail' : all.includes('pend') ? 'pend' : all.includes('warn') ? 'warn' : 'ok';
  return { cs, g, st };
}

function croquiElev(ic, c){
  if(!(c.r > 0) || !isFinite(c.Hnec)) return '<div class="croqui-vazio">Croqui disponível depois de informar raio, alturas e lingas.</div>';
  const hp = c.hp > 0 ? c.hp : 2.2, B = c.B > 0 ? c.B : 5, r = c.r, H = c.H > 0 ? c.H : 0.15;
  const dMin = Math.max((c.bal ? n0(ic.balComp)/2 : c.d) * 1.1, 0.5);
  const hw = Math.min(Math.max(c.C > 0 ? c.C/2 : 1, dMin), Math.max(r * 0.55, dMin));
  const xmin = -Math.max(B/2, 1.6) - 0.8, xmax = r + hw + 2.2, ymin = -1.5, ymax = Math.max(c.Hnec, c.cota) + 1.0;
  const Wp = 760, Hp = 400, s = Math.min((Wp - 30) / (xmax - xmin), (Hp - 20) / (ymax - ymin));
  const X = x => (15 + (x - xmin) * s).toFixed(1), Y = y => (Hp - 10 - (y - ymin) * s).toFixed(1);
  const rect = (x1, y1, x2, y2, extra) => `<rect x="${X(x1)}" y="${Y(y2)}" width="${((x2-x1)*s).toFixed(1)}" height="${((y2-y1)*s).toFixed(1)}" ${extra}/>`;
  const line = (x1, y1, x2, y2, extra) => `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" ${extra}/>`;
  const yb = c.cota + c.folga, yt = yb + H, lw = c.bal ? Math.min(n0(ic.balComp)/2, hw) : Math.min(c.d, hw);
  let g = '';
  g += line(xmin, 0, xmax, 0, 'stroke="#111" stroke-width="2"');
  if(c.cota > 0) g += rect(r - hw - 0.4, 0, r + hw + 0.4, c.cota, 'fill="#ECE9E1" stroke="#777" stroke-width="1"') +
    `<text x="${X(r)}" y="${Y(c.cota/2)}" font-size="17" text-anchor="middle" fill="#444">Ponto de montagem — ${f(c.cota,1)} m</text>`;
  // caminhão (vista de trás) e patolas
  g += rect(-1.2, 0, -0.75, 0.95, 'fill="#333"') + rect(0.75, 0, 1.2, 0.95, 'fill="#333"') + rect(-1.25, 0.9, 1.25, 1.75, 'fill="#C9CED3" stroke="#333" stroke-width="1"');
  g += line(-B/2, 0.8, B/2, 0.8, 'stroke="#2E4A66" stroke-width="4"') + line(-B/2, 0.8, -B/2, 0.12, 'stroke="#2E4A66" stroke-width="4"') + line(B/2, 0.8, B/2, 0.12, 'stroke="#2E4A66" stroke-width="4"');
  g += rect(-B/2 - 0.4, 0, -B/2 + 0.4, 0.12, 'fill="#C25E12"') + rect(B/2 - 0.4, 0, B/2 + 0.4, 0.12, 'fill="#C25E12"');
  // coluna e lança
  g += line(0, 1.75, 0, hp, 'stroke="#2E4A66" stroke-width="7" stroke-linecap="round"') + line(0, hp, r, c.Hnec, 'stroke="#2E4A66" stroke-width="5" stroke-linecap="round"');
  g += `<circle cx="${X(0)}" cy="${Y(hp)}" r="5" fill="#fff" stroke="#2E4A66" stroke-width="2"/><circle cx="${X(r)}" cy="${Y(c.Hnec)}" r="4" fill="#111"/>`;
  // lingas
  const ls = 'stroke="#B23A18" stroke-width="1.6"';
  if(c.bal){
    const yBal = c.Hnec - c.hSup;
    g += line(r, c.Hnec, r - lw, yBal, ls) + line(r, c.Hnec, r + lw, yBal, ls) + line(r - lw, yBal, r + lw, yBal, 'stroke="#111" stroke-width="4"');
    g += line(r - lw, yBal, r - lw, yt, ls) + line(r + lw, yBal, r + lw, yt, ls);
  } else if(c.n === 1) g += line(r, c.Hnec, r, yt, ls);
  else g += line(r, c.Hnec, r - lw, yt, ls) + line(r, c.Hnec, r + lw, yt, ls);
  g += rect(r - hw, yb, r + hw, yt, 'fill="#FBE7D6" stroke="#C25E12" stroke-width="1.5"');
  g += `<text x="${X(r)}" y="${(+Y(yb) + 19).toFixed(1)}" font-size="17" text-anchor="middle" fill="#8a3f08">Carga ${f(c.P,0)} kg</text>`;
  // cotas
  const cs = 'stroke="#111" stroke-width="1"';
  g += line(0, -0.75, r, -0.75, cs) + line(0, -0.95, 0, -0.55, cs) + line(r, -0.95, r, -0.55, cs) + line(0, 0, 0, -0.75, 'stroke="#999" stroke-width=".6" stroke-dasharray="3 3"') + line(r, yb, r, -0.75, 'stroke="#999" stroke-width=".6" stroke-dasharray="3 3"');
  g += `<text x="${X(r/2)}" y="${(+Y(-0.75) + 21).toFixed(1)}" font-size="19" font-weight="600" text-anchor="middle">Raio R = ${f(r)} m</text>`;
  const xc = r + hw + 1.2;
  g += line(xc, 0, xc, c.Hnec, cs) + line(xc - 0.2, 0, xc + 0.2, 0, cs) + line(xc - 0.2, c.Hnec, xc + 0.2, c.Hnec, cs);
  g += `<text transform="translate(${(+X(xc) + 20).toFixed(1)},${Y(c.Hnec/2)}) rotate(-90)" font-size="19" font-weight="600" text-anchor="middle">Altura do gancho = ${f(c.Hnec)} m</text>`;
  if(isFinite(c.Lreq)) g += `<text x="16" y="24" font-size="17" fill="#2E4A66">Lança ≈ ${f(c.Lreq,1)} m · ângulo ${f(c.angL,0)}°</text>`;
  return `<svg viewBox="0 0 ${Wp} ${Hp}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">${g}</svg>`;
}
function croquiPlanta(ic, c){
  if(!(c.r > 0)) return '<div class="croqui-vazio">Planta disponível depois de informar o raio.</div>';
  const Z = 380, cx = Z/2, cy = Z/2, Rm = (isFinite(c.Riso) ? c.Riso : c.r + 3) + 0.8, s = (Z/2 - 14) / Rm, B = c.B > 0 ? c.B : 5;
  const px = v => (v * s).toFixed(1);
  const cl = c.C > 0 ? c.C : 1, cw = Math.max(c.Lg > 0 ? c.Lg : 0.3, 0.3);
  let g = `<circle cx="${cx}" cy="${cy}" r="${px(c.Riso)}" fill="#FBEDE8" stroke="#B23A18" stroke-width="1.4" stroke-dasharray="7 4"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="${px(c.r)}" fill="#fff" stroke="#2E4A66" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  g += `<rect x="${(cx - 1.25*s).toFixed(1)}" y="${(cy - 2.2*s).toFixed(1)}" width="${px(2.5)}" height="${px(8.5)}" fill="#C9CED3" stroke="#333" stroke-width="1"/>`;
  g += `<line x1="${(cx - B/2*s).toFixed(1)}" y1="${cy}" x2="${(cx + B/2*s).toFixed(1)}" y2="${cy}" stroke="#2E4A66" stroke-width="3"/>`;
  [-1, 1].forEach(k => g += `<rect x="${(cx + k*B/2*s - 0.4*s).toFixed(1)}" y="${(cy - 0.4*s).toFixed(1)}" width="${px(0.8)}" height="${px(0.8)}" fill="#C25E12"/>`);
  g += `<line x1="${cx}" y1="${cy}" x2="${(cx + c.r*s).toFixed(1)}" y2="${cy}" stroke="#2E4A66" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="#2E4A66"/>`;
  g += `<rect x="${(cx + c.r*s - cw*s/2).toFixed(1)}" y="${(cy - cl*s/2).toFixed(1)}" width="${px(cw)}" height="${px(cl)}" fill="#FBE7D6" stroke="#C25E12" stroke-width="1.3"/>`;
  g += `<text x="${cx}" y="${(cy - c.Riso*s + 21).toFixed(1)}" font-size="17" text-anchor="middle" fill="#B23A18">Isolamento: raio ${f(c.Riso,1)} m</text>`;
  g += `<text x="${cx}" y="${(cy + c.Riso*s - 10).toFixed(1)}" font-size="17" text-anchor="middle" fill="#2E4A66">Raio de operação: ${f(c.r,1)} m</text>`;
  return `<svg viewBox="0 0 ${Z} ${Z}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">${g}</svg>`;
}

      <tr><td>Técnico de segurança</td><td>${txt(o.tst)}</td><td>Verificar APR/PT, isolamento, EPI e condições do tempo; interromper em caso de risco.</td></tr></table>
    <p>Todos com ASO válido, treinamentos em dia (NR-11/NR-12 para operador e sinaleiro; NR-35 para trabalho em altura) e EPI: capacete com jugular, calçado de segurança, luvas, óculos, colete refletivo e cinto paraquedista para quem trabalha em altura.</p>
    <h2>11. Sequência operacional</h2>
    <ol><li>Reunião de pré-içamento (DDS) com toda a equipe: leitura deste plano, funções, sinais e canal de rádio.</li>
      <li>Conferir documentos: plano assinado, APR/PT, inspeção do munck e certificados dos acessórios.</li>
      <li>Inspecionar munck e acessórios pelos checklists anexos; acessório reprovado é retirado e identificado.</li>
      <li>Posicionar o caminhão conforme a planta, em piso firme e nivelado; calçar rodas; abrir totalmente as patolas sobre os calços e nivelar.</li>
      <li>Isolar e sinalizar a área; retirar pessoas não envolvidas. Medir o vento.</li>
      <li>Amarrar a carga conforme a ficha de içamento, com proteção nos cantos vivos e cabos-guia instalados.</li>
      <li>Içamento de teste: elevar cerca de 20 cm, parar e conferir equilíbrio da carga, lingas, patolas e sustentação do equipamento.</li>
      <li>Elevar, girar e posicionar devagar, sem trancos, sem ultrapassar o raio máximo, conduzindo a carga pelos cabos-guia.</li>
      <li>Apoiar a carga no local definitivo. Só afrouxar e soltar as lingas com a carga apoiada, estável e travada.</li>
      <li>Ao terminar: recolher lança e patolas, retirar o isolamento e registrar as ocorrências.</li></ol>
    ${temT ? `<h3>Cuidados específicos — telhas</h3><ul>
      <li>Içar somente fardos cintados; nunca telhas soltas. Usar cintas têxteis com protetores de canto (não usar cabo de aço direto na telha).</li>
      <li>Telhas com mais de 6 m: usar balancim, para não dobrar nem amassar as telhas.</li>
      <li>Apoiar os fardos sobre as terças, junto aos pórticos/tesouras, distribuídos conforme orientação do projetista da estrutura — não concentrar fardos no meio do vão.</li>
      <li>Amarrar os fardos à estrutura logo após o apoio. Telhas soltas devem ser fixadas ou amarradas ao fim de cada jornada (risco de vento).</li>
      <li>Equipe na cobertura sempre ancorada em linha de vida; ninguém entre a carga e a borda.</li></ul>` : ''}
    ${temE ? `<h3>Cuidados específicos — estrutura metálica</h3><ul>
      <li>Conferir o peso de cada peça no projeto/romaneio e marcar os pontos de pega em relação ao centro de gravidade.</li>
      <li>Peças longas e esbeltas (tesouras, treliças, terças): verificar a estabilidade lateral no içamento; usar balancim ou pontos de pega travados quando indicado pelo projetista.</li>
      <li>Só soltar as lingas depois da fixação mínima definida pelo projetista (parafusos de montagem/solda) e do contraventamento provisório.</li>
      <li>Montadores em plataforma elevatória ou ancorados em linha de vida; proibido subir ou “pegar carona” na peça içada.</li></ul>` : ''}
    <h2>12. Comunicação</h2>
    <p>Um único sinaleiro orienta o operador, por sinais manuais padronizados (ABNT NBR 11436) e/ou rádio em canal exclusivo, testado antes do início. Se o operador perder o contato visual ou de rádio com o sinaleiro, a movimentação para imediatamente.</p>
    <h2>13. Emergências</h2>
    <ul><li>Qualquer pessoa pode dar o sinal de PARE. A operação só recomeça depois de avaliada pelo supervisor.</li>
      <li>Vento forte repentino ou mudança do tempo: baixar a carga em local seguro e suspender.</li>
      <li>Vazamento ou falha hidráulica, afundamento de patola ou inclinação do caminhão: parar, baixar a carga se for seguro, isolar a área e acionar a manutenção.</li>
      <li>Contato com rede elétrica: afastar todas as pessoas (mínimo 10 m), não tocar no caminhão nem na carga, acionar a concessionária e o Corpo de Bombeiros.</li>
      <li>Acidente com vítima: SAMU 192 / Bombeiros 193; comunicar imediatamente o supervisor e o técnico de segurança.</li></ul>
    <div class="keep">${notaLegal()}
    ${assinaturas([[o.elaborador, 'Elaboração'], [o.respTecnico, 'Responsável técnico — CREA ' + txt(o.crea, '______') + ' — ART ' + txt(o.art, '______')], [o.supervisor, 'Supervisor do içamento'], [o.tst, 'Técnico de segurança']])}</div>`;
}
function memoIc(ic, i, c){
  const L = S.local;
  let h = `<h3>2.${i+1} ${icNome(ic, i)}</h3>
    <div class="calc"><b>a) Peso da carga</b><br>${c.pesoTxt}</div>
    <div class="calc"><b>b) Carga bruta de cálculo (CB)</b><br>Acessórios = lingas ${f(c.pLing,0)} + manilhas ${f(c.pMan,0)} + balancim ${f(c.pBal,0)} + gancho/moitão ${f(c.pGancho,0)} = ${f(c.Pac,0)} kg<br>
      CB = P × Fc + acessórios = ${f(c.P,0)} × ${f(c.fc)} + ${f(c.Pac,0)} = <b>${f(c.CB,0)} kg</b></div>
    <div class="calc"><b>c) Capacidade do munck e utilização</b> ${stSpan(stOf(c,'cap'))}<br>Raio de operação R = ${f(c.r)} m → raio tabelado adotado (igual ou imediatamente maior) = ${f(c.rTab)} m → capacidade = ${c.cap > 0 ? f(c.cap,0) : '—'} kg<br>
      Utilização = CB ÷ capacidade = ${f(c.CB,0)} ÷ ${c.cap > 0 ? f(c.cap,0) : '—'} = <b>${f(c.util,1)} %</b> (limite adotado ${f(c.utilMax,0)} %)<br>
      Momento atuante = CB × R = ${f(c.CB * c.r / 1000,1)} t·m (nominal do equipamento: ${txt(S.munck.momento)} t·m)</div>`;
  if(c.bal){
    h += `<div class="calc"><b>d) Lingas inferiores (verticais, sob o balancim)</b> ${stSpan(stOf(c,'linga'))}<br>
      Força por linga T = P × Fc × FAD ÷ n = ${f(c.P,0)} × ${f(c.fc)} × ${f(c.fad)} ÷ ${c.nEf} = <b>${f(c.T,0)} kg</b><br>
      CMT necessária = T ÷ fator da amarração (${MODO_NOME[ic.modo].toLowerCase()} = ${f(c.mf,1)}) = <b>${f(c.cmtReq,0)} kg</b> × CMT da linga ${f(c.cmt,0)} kg</div>
    <div class="calc"><b>e) Balancim e lingas superiores</b> ${stSpan(stOf(c,'bal'))} ${stSpan(stOf(c,'sup'))}<br>
      Carga no balancim = (P × Fc + lingas) × FAD = (${f(c.W,0)} + ${f(c.pLing,0)}) × ${f(c.fad)} = <b>${f(c.Wbal,0)} kg</b> × CMT do balancim ${f(num(ic.balCmt),0)} kg<br>
      Ângulo das lingas superiores com a vertical: β = arcsen[(comprimento do balancim ÷ 2) ÷ comprimento da linga] = arcsen(${f(num(ic.balComp)/2)} ÷ ${f(num(ic.supComp))}) = <b>${f(deg(c.betaS),1)}°</b> (máx. 60°)<br>
      Força por perna superior = (P × Fc + lingas + balancim) × FAD ÷ (2 × cos β) = (${f(c.W,0)} + ${f(c.pLing,0)} + ${f(c.pBal,0)}) × ${f(c.fad)} ÷ (2 × ${f(Math.cos(c.betaS),3)}) = <b>${f(c.Tsup,0)} kg</b> × CMT ${f(num(ic.supCmt),0)} kg</div>`;
  } else {
    h += `<div class="calc"><b>d) Lingas</b> ${stSpan(stOf(c,'ang'))} ${stSpan(stOf(c,'linga'))}<br>` +
      (c.n > 1 ? `Ângulo com a vertical: β = arcsen(distância do ponto de pega ao centro ÷ comprimento da perna) = arcsen(${f(c.d)} ÷ ${f(c.Lc)}) = <b>${f(deg(c.beta),1)}°</b> (recomendado até 45°; máximo 60°)<br>` : 'Linga única na vertical (β = 0°).<br>') +
      `Pernas consideradas no cálculo: n = ${c.nEf}${c.n >= 4 ? ' (em conjuntos de 4 pernas considera-se que nem todas trabalham igualmente)' : ''}<br>
      Força por perna T = P × Fc × FAD ÷ (n × cos β) = ${f(c.P,0)} × ${f(c.fc)} × ${f(c.fad)} ÷ (${c.nEf} × ${f(Math.cos(c.beta),3)}) = <b>${f(c.T,0)} kg</b><br>
      CMT necessária = T ÷ fator da amarração (${MODO_NOME[ic.modo].toLowerCase()} = ${f(c.mf,1)}) = <b>${f(c.cmtReq,0)} kg</b> × CMT da linga ${f(c.cmt,0)} kg</div>`;
  }
  if(c.manQ > 0) h += `<div class="calc"><b>${c.bal ? 'f' : 'e'}) Manilhas</b> ${stSpan(stOf(c,'man'))}<br>Força no ponto de ligação = ${f(c.T,0)} kg × CMT da manilha ${f(c.manCmt,0)} kg</div>`;
  h += `<div class="calc"><b>Altura do gancho e lança</b> ${stSpan(stOf(c,'lanca'))}<br>
      Altura necessária do gancho = ponto de montagem + folga + altura da carga + altura da amarração = ${f(c.cota)} + ${f(c.folga)} + ${f(c.H)} + ${f(c.Hnec - c.cota - c.folga - (c.H > 0 ? c.H : 0))} = <b>${f(c.Hnec)} m</b><br>
      Lança necessária ≈ √[R² + (altura − pivô)²] = √[${f(c.r)}² + (${f(c.Hnec)} − ${f(c.hp)})²] = <b>${f(c.Lreq)} m</b>, ângulo ${f(c.angL,0)}° × lança máxima ${f(c.lmax)} m (verificação geométrica simplificada)</div>
    <div class="calc"><b>Reação na patola e pressão no solo</b> ${stSpan(stOf(c,'solo'))}<br>` +
      (c.rpFab ? `Reação máxima na patola informada pelo fabricante: <b>${f(c.Rp,0)} kgf</b><br>`
        : `Estimativa conservadora (lança perpendicular ao caminhão, todo o peso do conjunto sobre as duas patolas): Rp = CB × FAD × (R ÷ B + 0,5) + Pconjunto ÷ 2<br>
           Rp = ${f(c.CB,0)} × ${f(c.fad)} × (${f(c.r)} ÷ ${f(c.B)} + 0,5) + ${f(c.Wc,0)} ÷ 2 = <b>${f(c.Rp,0)} kgf</b><br>`) +
      `Pressão no solo = Rp ÷ área do calço = ${f(c.Rp,0)} ÷ (${f(n0(L.calcoL),0)} × ${f(n0(L.calcoC),0)} cm) = <b>${f(c.pSolo)} kgf/cm²</b> × admissível ${f(c.sigma)} kgf/cm²<br>
      Área mínima de calço = Rp ÷ σadm = ${f(c.Amin,0)} cm² (≈ ${f(Math.ceil(Math.sqrt(c.Amin)),0)} × ${f(Math.ceil(Math.sqrt(c.Amin)),0)} cm)</div>
    <div class="calc"><b>Efeito do vento na carga</b> ${stSpan(stOf(c,'vento'))}<br>
      Fv = 0,613 × V² × A × Cf ÷ 9,81, com V = ${f(c.Vlim,0)} km/h = ${f(c.Vlim/3.6)} m/s, A = ${f(c.Av)} m² (maior face), Cf = 1,2 → Fv ≈ <b>${f(c.Fv,0)} kgf</b> (${f(c.rv,1)} % do peso da carga)</div>`;
  if(isFinite(c.dMin)) h += `<div class="calc"><b>Rede elétrica</b> ${stSpan(stOf(c,'rede'))}<br>Distância mínima adotada para ${txt(L.redeKv)} kV: ${f(c.dMin,1)} m × distância prevista ${f(num(L.redeDist))} m</div>`;
  h += `<p><b>Resultado do içamento ${i+1}:</b> <span class="st ${c.st}">${ST_NOME[c.st]}</span></p>`;
  return h;
}

  });
  $('#doc-checklists').innerHTML = docHeader('Checklists de Içamento') + `
    <table class="t"><tr><th style="width:16%">Equipamento</th><td>${txt(m.marca)} ${txt(m.modelo, '')} — placa ${txt(m.placa)}</td><th style="width:12%">Operador</th><td>${txt(o.operador)}</td><th style="width:8%">Data</th><td style="width:14%">____/____/______</td></tr></table>
    <h2>A. Inspeção pré-uso do munck</h2>
    <table class="t">${cab}${linhas([
      'Documentos do veículo, manual e tabela de carga legível fixada no equipamento',
      'Inspeção periódica / laudo do munck dentro da validade, com ART',
      'Operador capacitado e autorizado, com CNH compatível e ASO válido',
      'Coluna, lanças e extensões sem trincas, deformações ou corrosão acentuada',
      'Pinos, travas e contrapinos presentes e íntegros',
      'Cilindros hidráulicos sem vazamento; hastes sem riscos ou amassados',
      'Mangueiras, tubos e conexões sem vazamento, ressecamento ou atrito',
      'Nível do óleo hidráulico correto',
      'Válvulas de retenção atuando: a carga não desce com os comandos em neutro',
      'Limitador de momento / dispositivo de sobrecarga funcionando (quando houver)',
      'Comandos identificados, voltando sozinhos ao neutro; parada de emergência funcionando',
      'Gancho com trava de segurança, girando livre, sem deformação ou abertura',
      'Patolas: extensão, travas, cilindros e sapatas em bom estado',
      'Calços das patolas disponíveis nas dimensões do plano e sem trincas',
      'Pneus, freio de estacionamento e calços de roda',
      'Giro sem folga excessiva nem ruído anormal',
      'Extintor, cones, fita de isolamento e alarme sonoro'])}</table>
    <h2>B. Inspeção dos acessórios de içamento</h2>
    <table class="t"><tr><th class="c">Içam.</th><th>Acessório previsto no plano</th><th class="c">Qtd.</th><th class="n">CMT (kg)</th><th>Identificação / TAG</th><th class="c">Aprovado</th><th class="c">Reprovado</th></tr>
      ${acess.map(a => `<tr><td class="c">${a[0]}</td><td>${a[1]}</td><td class="c">${a[2]}</td><td class="n">${a[3]}</td><td></td><td class="c"><span class="box"></span></td><td class="c"><span class="box"></span></td></tr>`).join('')}</table>
    <table class="t">${cab}${linhas([
      'Todos os acessórios com etiqueta/plaqueta de CMT legível e certificado do fabricante',
      'Cintas: sem cortes, furos, queimaduras, costuras rompidas, nós ou desgaste que exponha os fios',
      'Cabos de aço: sem arames rompidos acima do permitido, amassamentos, “gaiola de passarinho”, dobras ou corrosão; presilhas e olhais íntegros',
      'Correntes: sem elos alongados, trincados, torcidos ou gastos',
      'Manilhas: pino original, rosca perfeita, sem deformação ou desgaste; pino totalmente rosqueado',
      'Balancim: sem trincas ou deformações, olhais íntegros, CMT identificada',
      'Protetores de canto disponíveis para arestas vivas',
      'Cabos-guia em bom estado e com comprimento suficiente'])}</table>
    <h2 class="pb">C. Liberação do içamento (preencher no dia, antes de cada frente)</h2>
    <table class="t">${cab}${linhas([
      'Plano de rigging assinado e disponível na frente de serviço; equipe leu e entendeu',
      'APR e Permissão de Trabalho emitidas; DDS realizado',
      'Peso da carga conferido com o projeto / romaneio',
      'Caminhão na posição do plano; raio máximo conferido com trena',
      'Solo firme; calços posicionados; patolas totalmente abertas; equipamento nivelado; rodas calçadas',
      `Área isolada e sinalizada (raio mínimo ${rMaxIso ? f(rMaxIso,1) : '____'} m)`,
      `Vento medido: ______ km/h (limite ${f(n0(L.vento),0)} km/h; telhas ${f(n0(L.ventoTelha),0)} km/h)`,
      'Sem chuva forte, raios ou baixa visibilidade',
      'Distância de redes elétricas conferida',
      'Acessórios inspecionados e montados conforme a ficha de içamento; cantos vivos protegidos',
      'Cabos-guia instalados',
      'Comunicação testada (sinais / rádio) e sinaleiro definido',
      'Equipe com EPI; trabalho em altura com ancoragem e linha de vida',
      'Içamento de teste (20 cm) realizado sem anormalidades'])}</table>
    <p><b>Liberação:</b> <span class="box"></span> Liberado &nbsp;&nbsp; <span class="box"></span> Não liberado — motivo: ________________________________________________</p>
    ${assinaturas([[o.operador, 'Operador do munck'], [o.sinaleiro, 'Sinaleiro / amarrador'], [o.supervisor, 'Supervisor do içamento'], [o.tst, 'Técnico de segurança']])}`;
}
function renderDocs(){
  const R = calcTudo();
  renderPlano(R); renderMemorial(R); renderLaudo(R); renderChecklists(R);
  return R;
}

/* ---------- Navegação e ações ---------- */
function mostrarAba(aba){
  abaAtual = aba;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === aba));
  const dados = aba === 'dados';
  $('#view-dados').style.display = dados ? '' : 'none';
  $('#view-docs').style.display = dados ? 'none' : '';
  if(dados) renderForm();
  else {
    renderDocs();
    document.querySelectorAll('.doc').forEach(d => d.style.display = d.id === 'doc-' + aba ? '' : 'none');
    window.scrollTo(0, 0);
  }
}
function imprimir(qual){
  const R = renderDocs();
  if(R.st === 'pend' && !confirm('Ainda faltam dados para concluir as verificações. Os documentos sairão marcados como “DADOS INCOMPLETOS”. Imprimir mesmo assim?')) return;
  if(R.st === 'fail' && !confirm('Há verificações REPROVADAS. Os documentos sairão marcados como “REPROVADO”. Imprimir mesmo assim?')) return;
  document.body.dataset.print = qual;
  const antigo = document.title;
  document.title = `${qual === 'all' ? 'Plano de Rigging completo' : ({ plano:'Plano de Rigging', memorial:'Memorial de Calculo', laudo:'Laudo Tecnico', checklists:'Checklists' }[qual])} ${S.obra.numero || ''} ${S.obra.nome || ''}`.trim();
  window.print();
  document.title = antigo;
}
function baixar(nome, texto){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type:'application/json' }));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const ACOES = {
  'novo'(){ if(confirm('Começar um plano novo? Os dados do plano atual serão apagados deste navegador (os muncks salvos continuam).')){ S = novoPlano(); salvar(); renderForm(); } },
  'exemplo'(){ if(confirm('Preencher com um exemplo fictício? Os dados atuais serão substituídos. Os números do exemplo servem só para demonstração.')){ S = planoExemplo(); salvar(); renderForm(); } },
  'export'(){ baixar(`plano-rigging-${(S.obra.numero || 'sem-numero').replace(/[^\w-]+/g,'_')}.json`, JSON.stringify(S, null, 2)); },
  'import'(){ $('#file-import').click(); },
  'add-telha'(){ S.icamentos.push(novoIcamento('telha')); salvar(); renderForm(); },
  'add-estr'(){ S.icamentos.push(novoIcamento('estrutura')); salvar(); renderForm(); },
  'dup-ic'(el){ const i = +el.dataset.i; S.icamentos.splice(i + 1, 0, { ...S.icamentos[i], id:uid() }); salvar(); renderForm(); },
  'del-ic'(el){ if(confirm('Excluir este içamento?')){ S.icamentos.splice(+el.dataset.i, 1); salvar(); renderForm(); } },
  'add-row'(){ S.munck.tabela.push({ raio:'', cap:'' }); salvar(); renderForm(); },
  'del-row'(el){ S.munck.tabela.splice(+el.dataset.i, 1); if(!S.munck.tabela.length) S.munck.tabela.push({ raio:'', cap:'' }); salvar(); renderForm(); },
  'save-munck'(){
    const nome = nomeMunck(S.munck);
    if(!nome){ alert('Informe pelo menos a marca e o modelo do munck antes de salvar.'); return; }
    const lista = muncksSalvos(), i = lista.findIndex(x => nomeMunck(x) === nome);
    const copia = JSON.parse(JSON.stringify(S.munck));
    if(i >= 0) lista[i] = copia; else lista.push(copia);
    try{ localStorage.setItem(LS_MUNCKS, JSON.stringify(lista)); }catch(e){}
    renderForm(); alert(`Munck “${nome}” salvo. Nos próximos planos é só escolher na lista “Muncks salvos”.`);
  },
  'load-munck'(){
    const i = $('#sel-munck').value; if(i === '') { alert('Escolha um munck na lista.'); return; }
    const origem = i[0] === 'c' ? MUNCKS_CADASTRADOS[+i.slice(1)] : muncksSalvos()[+i];
    S.munck = { ...novoPlano().munck, ...JSON.parse(JSON.stringify(origem)) }; salvar(); renderForm();
  },
  'del-munck'(){
    const i = $('#sel-munck').value; if(i === '') { alert('Escolha um munck na lista.'); return; }
    if(i[0] === 'c'){ alert('Este munck faz parte do cadastro do sistema e não pode ser apagado por aqui.'); return; }
    const lista = muncksSalvos();
    if(!confirm(`Apagar “${nomeMunck(lista[+i])}” da lista de muncks salvos?`)) return;
    lista.splice(+i, 1); try{ localStorage.setItem(LS_MUNCKS, JSON.stringify(lista)); }catch(e){}
    renderForm();
  },
  'print'(){ if(abaAtual === 'dados') mostrarAba('plano'); imprimir(abaAtual); },
  'print-all'(){ if(abaAtual === 'dados') mostrarAba('plano'); imprimir('all'); }
};
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab'); if(tab){ mostrarAba(tab.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if(el && ACOES[el.dataset.act]) ACOES[el.dataset.act](el);
});
function aoEditar(e){
  const el = e.target.closest('[data-path]'); if(!el) return;
  const path = el.dataset.path;
  setPath(path, el.value);
  if(path.endsWith('.telhaModelo')){ const t = TELHAS.find(x => x.id === el.value); if(t && t.kgm2) setPath(path.replace('telhaModelo', 'kgm2'), t.kgm2); }
  if(path === 'local.soloTipo'){ const s = SOLOS.find(x => x.id === el.value); if(s && s.sigma) S.local.sigma = s.sigma; }
  salvar();
  if(el.dataset.rr && e.type === 'change') renderForm(); else atualizarResultados();
}
document.addEventListener('input', aoEditar);
document.addEventListener('change', aoEditar);
$('#file-import').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  try{
    const p = JSON.parse(await file.text());
    if(!p || typeof p !== 'object' || !p.munck || !p.icamentos) throw new Error('formato');
    S = normalizar(p); salvar(); mostrarAba('dados');
  }catch(err){ alert('Não foi possível ler este arquivo. Use um arquivo gerado pelo botão “Exportar plano”.'); }
});
window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

$('#logo-top').src = LOGO_DATA_URI;
$('#ver').textContent = RIG_VERSION;
(function(){ const l = document.createElement('link'); l.rel = 'icon'; l.href = LOGO_DATA_URI; document.head.appendChild(l); })();
renderForm();
</script>
</body>
</html>
